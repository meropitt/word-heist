<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Heist: The Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="window.__supabaseLibLoaded && window.__supabaseLibLoaded()"></script>
<style>
  :root{
    --void: #05070d;
    --panel: #0d1420;
    --panel-2: #121d2e;
    --steel: #2a3a52;
    --neon-cyan: #2fe6d9;
    --neon-cyan-dim: rgba(47,230,217,0.15);
    --gold: #f2b134;
    --gold-dim: rgba(242,177,52,0.15);
    --danger: #ff4d5e;
    --ok: #4de08a;
    --text: #e8f2f7;
    --text-dim: #7d93a8;
    --font-display: 'Chakra Petch', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(47,230,217,0.08), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 3px),
      var(--void);
    color: var(--text);
    font-family: var(--font-display);
    padding: 16px 12px 50px;
  }
  .app{ max-width: 520px; margin: 0 auto; }

  .brand{
    text-align:center; margin-bottom:18px;
  }
  .brand .lock-icon{
    font-size: 2.2rem; margin-bottom: 6px;
    filter: drop-shadow(0 0 10px var(--neon-cyan));
  }
  .brand h1{
    font-size: 1.5rem; letter-spacing: 3px; margin: 0;
    text-transform: uppercase; font-weight: 700;
    color: #fff;
  }
  .brand .glow{ color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan); }
  .brand .sub{
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 3px;
    color: var(--text-dim); text-transform: uppercase; margin-top: 4px;
  }

  .panel{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--steel);
    border-radius: 10px;
    padding: 20px 18px;
    margin-bottom: 14px;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }
  .panel::before{
    content:'';
    position:absolute; top:0; left:16px; right:16px; height:1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    opacity: 0.5;
  }
  .tag{
    display:inline-block;
    font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 2px;
    text-transform: uppercase; color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan-dim); background: var(--neon-cyan-dim);
    padding: 3px 10px; border-radius: 3px; margin-bottom: 12px;
  }
  h2{ font-size: 1.15rem; margin: 0 0 10px; letter-spacing: 0.5px; }
  p{ line-height:1.6; color: var(--text); margin: 0 0 10px; font-size:0.95rem; }
  p.dim{ color: var(--text-dim); font-family: var(--font-mono); font-size: 0.82rem; }

  input[type=text]{
    width:100%; font-family: var(--font-display); font-size:1rem;
    padding: 13px 14px; border-radius: 6px; border: 1.5px solid var(--steel);
    background: #0a121e; color: var(--text); margin-bottom: 12px;
  }
  input[type=text]:focus{ outline:none; border-color: var(--neon-cyan); box-shadow: 0 0 0 3px var(--neon-cyan-dim); }

  .btn{
    font-family: var(--font-display); font-weight:700; font-size: 0.92rem;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 14px 18px; border-radius: 7px; border:none; cursor:pointer;
    width:100%; transition: transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: linear-gradient(135deg, var(--neon-cyan), #1aa89c); color:#04231f; box-shadow: 0 0 20px rgba(47,230,217,0.35); }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-gold{ background: linear-gradient(135deg, var(--gold), #c98a1c); color:#2a1a02; box-shadow: 0 0 20px rgba(242,177,52,0.3); }
  .btn-ghost{ background: transparent; border: 1.5px solid var(--steel); color: var(--text-dim); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  /* timer bar */
  .timer-wrap{
    height: 8px; border-radius: 4px; background: #0a121e;
    border: 1px solid var(--steel); overflow:hidden; margin-bottom: 16px;
  }
  .timer-bar{
    height:100%; background: linear-gradient(90deg, var(--neon-cyan), var(--gold));
    width:100%; transition: width 0.1s linear;
  }
  .timer-bar.danger{ background: var(--danger); }

  /* streak / score HUD */
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim);
    margin-bottom: 12px; padding: 0 2px;
  }
  .hud .score-num{ color: var(--gold); font-weight:700; font-size:1rem; }
  .streak-flame{ display:inline-flex; align-items:center; gap:4px; }
  .streak-flame.hot{ color: var(--danger); }
  .multiplier-badge{
    display:inline-block; background: var(--gold-dim); color: var(--gold);
    border: 1px solid var(--gold); border-radius: 20px; padding: 2px 10px;
    font-family: var(--font-mono); font-size: 0.72rem; margin-left: 6px;
  }

  .mc-option{
    display:block; width:100%; text-align:left;
    background: #0a121e; border: 1.5px solid var(--steel); border-radius: 7px;
    padding: 13px 15px; margin-bottom: 9px; cursor:pointer;
    font-family: var(--font-display); font-size: 0.95rem; color: var(--text);
  }
  .mc-option:hover{ border-color: var(--neon-cyan); }
  .mc-option.correct{ border-color: var(--ok); background: rgba(77,224,138,0.1); }
  .mc-option.wrong{ border-color: var(--danger); background: rgba(255,77,94,0.1); }
  .mc-option:disabled{ pointer-events:none; }

  .feedback{
    font-family: var(--font-mono); font-size: 0.82rem;
    padding: 10px 12px; border-radius: 6px; margin: 6px 0 4px;
  }
  .feedback.ok{ background: rgba(77,224,138,0.12); color: var(--ok); border:1px solid var(--ok); }
  .feedback.bad{ background: rgba(255,77,94,0.12); color: var(--danger); border:1px solid var(--danger); }

  .round-track{
    display:flex; gap:4px; margin-bottom: 14px; flex-wrap:wrap;
  }
  .round-dot{
    width:10px; height:10px; border-radius:2px; background: var(--steel);
  }
  .round-dot.correct{ background: var(--ok); }
  .round-dot.wrong{ background: var(--danger); }
  .round-dot.active{ background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

  /* vault door */
  .vault-scene{
    text-align:center; padding: 10px 0 4px;
  }
  .vault-door{
    width: 160px; height:160px; margin: 6px auto 18px; position:relative;
  }
  .vault-ring{
    width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #2a3a52, #0a121e 70%);
    border: 6px solid var(--steel);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition: transform 1.2s cubic-bezier(.6,-0.28,.74,.05), opacity 0.8s ease;
  }
  .vault-ring.open{ transform: rotate(280deg) scale(0.5); opacity: 0; }
  .vault-ring .bolt{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: var(--gold); box-shadow: 0 0 6px var(--gold);
  }
  .vault-center{
    width:56px; height:56px; border-radius:50%;
    background: linear-gradient(135deg, var(--gold), #a86f16);
    display:flex; align-items:center; justify-content:center; font-size:1.4rem;
  }
  .big-result{
    font-size: 2rem; font-weight:700; color: var(--gold);
    text-shadow: 0 0 20px var(--gold); margin: 6px 0 4px;
  }

  .team-tag{
    font-family: var(--font-mono); font-size:0.72rem; color: var(--text-dim);
    text-align:center; letter-spacing:1px; margin-bottom: 10px; text-transform:uppercase;
  }

  .lb-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 4px; border-bottom: 1px solid var(--steel);
    font-family: var(--font-mono); font-size: 0.88rem;
  }
  .lb-row:last-child{ border-bottom:none; }
  .lb-rank{ color: var(--neon-cyan); font-weight:700; width:30px; }
  .lb-rank.gold{ color: var(--gold); }
  .lb-name{ flex:1; }
  .lb-score{ font-weight:700; color: var(--gold); }

  .center-note{
    text-align:center; color: var(--text-dim); font-family: var(--font-mono);
    font-size: 0.75rem; margin-top: 8px;
  }

  .cfg-note{
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim);
    background: #0a121e; border: 1px dashed var(--steel); border-radius: 6px;
    padding: 10px; margin-top: 10px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   SUPABASE CONFIG — fill these in before deploying
   Get them from: Supabase project → Settings → API
   ============================================================ */
const SUPABASE_URL = "https://fttdyfyuzlyhgjudcefd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IHJz931f_p6eyWMLpJHong_bHvZ0aqI";

let supabase = null;
let supabaseReady = false;

function tryInitSupabase(){
  if(supabaseReady) return true;
  try{
    if(SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
       SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY" &&
       window.supabase && typeof window.supabase.createClient === 'function'){
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      supabaseReady = true;
      return true;
    }
  }catch(e){ console.error('Supabase init failed', e); }
  return false;
}

/* Called automatically once the Supabase library finishes downloading,
   however long that takes on a slow connection. */
window.__supabaseLibLoaded = function(){
  if(tryInitSupabase()){
    // If the leaderboard warning or welcome screen is already on screen,
    // refresh it now that the connection is actually ready.
    if(typeof render === 'function' && (state.screen === 'welcome' || state.screen === 'leaderboard')){
      render();
    }
  }
};

/* Try immediately too, in case the library was already cached/fast. */
tryInitSupabase();

/* ============================================================
   QUESTION BANK — fast, punchy English challenges
   ============================================================ */
const QUESTIONS = [
  { q: "Choose the correct word: \"She ___ to the store every day.\"", opts: ["go","goes","going","gone"], correct: 1 },
  { q: "What is the synonym of \"happy\"?", opts: ["sad","joyful","angry","tired"], correct: 1 },
  { q: "Fix the sentence: \"He don't like coffee.\"", opts: ["He doesn't like coffee.","He not like coffee.","He no likes coffee.","He isn't like coffee."], correct: 0 },
  { q: "What is the opposite of \"ancient\"?", opts: ["old","modern","dusty","historic"], correct: 1 },
  { q: "Choose the correct word: \"They ___ finished the project.\"", opts: ["has","have","having","haves"], correct: 1 },
  { q: "What does \"reluctant\" mean?", opts: ["excited","unwilling","confused","certain"], correct: 1 },
  { q: "Fix the sentence: \"I have went there yesterday.\"", opts: ["I have gone there yesterday.","I went there yesterday.","I have go there yesterday.","I going there yesterday."], correct: 1 },
  { q: "What is the synonym of \"quickly\"?", opts: ["slowly","rapidly","calmly","rarely"], correct: 1 },
  { q: "Choose the correct word: \"If I ___ rich, I would travel.\"", opts: ["am","was","were","be"], correct: 2 },
  { q: "What does \"betray\" mean?", opts: ["to help","to break someone's trust","to celebrate","to forgive"], correct: 1 },
  { q: "Fix the sentence: \"Where you are going?\"", opts: ["Where are you going?","Where you going are?","Where going you are?","Where you go?"], correct: 0 },
  { q: "What is the opposite of \"generous\"?", opts: ["kind","selfish","wealthy","friendly"], correct: 1 },
  { q: "Choose the correct word: \"By next year, I ___ my degree.\"", opts: ["will finish","will have finished","finished","am finishing"], correct: 1 },
  { q: "What does \"unmistakable\" mean?", opts: ["confusing","impossible to doubt","hidden","forgettable"], correct: 1 },
  { q: "Fix the sentence: \"She more taller than him.\"", opts: ["She is more tall than him.","She is taller than him.","She taller than him.","She is tallest than him."], correct: 1 },
  { q: "What is the synonym of \"conclusion\"?", opts: ["question","outcome","mystery","beginning"], correct: 1 },
  { q: "Choose the correct word: \"This book ___ by millions of people.\"", opts: ["read","reads","was read","reading"], correct: 2 },
  { q: "What does \"inconsistent\" mean?", opts: ["always the same","not matching or steady","very careful","completely true"], correct: 1 },
];

/* shuffle a copy of the array */
function shuffled(arr){ return [...arr].sort(() => Math.random() - 0.5); }

/* ============================================================
   STATE
   ============================================================ */
let state = {
  screen: 'welcome',
  teamName: '',
  score: 0,
  streak: 0,
  bestStreak: 0,
  roundIndex: 0,
  rounds: [],          // shuffled + sliced question set for this run
  roundResults: [],    // 'correct' | 'wrong' per round
  timer: null,
  timeLeft: 100,
  answered: false
};

const TOTAL_ROUNDS = 10;
const TIME_PER_Q = 10; // seconds

const app = document.getElementById('app');

function render(){
  if(state.screen==='welcome') return renderWelcome();
  if(state.screen==='team') return renderTeam();
  if(state.screen==='play') return renderPlay();
  if(state.screen==='vault') return renderVault();
  if(state.screen==='leaderboard') return renderLeaderboard();
}

function renderWelcome(){
  app.innerHTML = `
    <div class="brand">
      <div class="lock-icon">🔐</div>
      <h1>WORD <span class="glow">HEIST</span></h1>
      <div class="sub">Crack the vault with English</div>
    </div>
    <div class="panel">
      <span class="tag">Mission Briefing</span>
      <h2>The Rules</h2>
      <p>Answer ${TOTAL_ROUNDS} fast English rounds before the timer runs out. Chain correct answers for a score multiplier. Break the vault. Top the leaderboard.</p>
      <p class="dim">⏱ ${TIME_PER_Q}s per question &nbsp;·&nbsp; 🔥 streaks multiply your score &nbsp;·&nbsp; 🏆 shared leaderboard</p>
      <button class="btn btn-primary" onclick="goTeam()">Enter the Vault</button>
    </div>
    ${!supabaseReady ? `<div class="cfg-note">⚠ Leaderboard not connected yet. Add your SUPABASE_URL and SUPABASE_ANON_KEY at the top of the script to enable the shared, online leaderboard.</div>` : ''}
  `;
}

function goTeam(){ state.screen='team'; render(); }

function renderTeam(){
  app.innerHTML = `
    <div class="brand"><h1>WORD <span class="glow">HEIST</span></h1></div>
    <div class="panel">
      <span class="tag">Crew Registration</span>
      <h2>Name your crew</h2>
      <input type="text" id="teamInput" placeholder="e.g. The Grammar Ghosts" maxlength="24">
      <button class="btn btn-primary" onclick="startRun()">Start the Heist</button>
    </div>
  `;
  document.getElementById('teamInput').focus();
  document.getElementById('teamInput').addEventListener('keydown', e => { if(e.key==='Enter') startRun(); });
}

function startRun(){
  const val = document.getElementById('teamInput').value.trim();
  if(!val) return;
  state.teamName = val;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.roundIndex = 0;
  state.roundResults = [];
  state.rounds = shuffled(QUESTIONS).slice(0, TOTAL_ROUNDS);
  state.screen = 'play';
  render();
}

function multiplierFor(streak){
  if(streak >= 7) return 3;
  if(streak >= 4) return 2;
  if(streak >= 2) return 1.5;
  return 1;
}

function renderPlay(){
  const q = state.rounds[state.roundIndex];
  const mult = multiplierFor(state.streak);
  app.innerHTML = `
    <div class="team-tag">${escapeHtml(state.teamName)} · Round ${state.roundIndex+1}/${TOTAL_ROUNDS}</div>
    <div class="hud">
      <span>SCORE <span class="score-num">${state.score}</span></span>
      <span class="streak-flame ${state.streak>=4?'hot':''}">🔥 ${state.streak}<span class="multiplier-badge">x${mult}</span></span>
    </div>
    <div class="round-track">
      ${state.rounds.map((_,i)=>{
        let cls = 'round-dot';
        if(i === state.roundIndex) cls += ' active';
        else if(state.roundResults[i] === 'correct') cls += ' correct';
        else if(state.roundResults[i] === 'wrong') cls += ' wrong';
        return `<div class="${cls}"></div>`;
      }).join('')}
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="panel">
      <span class="tag">Lock ${state.roundIndex+1}</span>
      <h2>${q.q}</h2>
      <div id="options"></div>
    </div>
  `;
  const optsDiv = document.getElementById('options');
  q.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.className = 'mc-option';
    b.textContent = opt;
    b.onclick = () => answer(idx);
    optsDiv.appendChild(b);
  });
  startTimer();
}

function startTimer(){
  clearInterval(state.timer);
  state.timeLeft = TIME_PER_Q * 10; // tenths of a second
  state.answered = false;
  const bar = document.getElementById('timerBar');
  state.timer = setInterval(() => {
    state.timeLeft -= 1;
    const pct = Math.max(0, (state.timeLeft / (TIME_PER_Q*10)) * 100);
    if(bar){
      bar.style.width = pct + '%';
      if(pct < 25) bar.classList.add('danger');
    }
    if(state.timeLeft <= 0){
      clearInterval(state.timer);
      if(!state.answered) answer(-1); // time's up = wrong
    }
  }, 100);
}

function answer(idx){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);

  const q = state.rounds[state.roundIndex];
  const correct = idx === q.correct;
  const opts = document.querySelectorAll('.mc-option');
  opts.forEach((el,i) => {
    el.disabled = true;
    if(i === q.correct) el.classList.add('correct');
    else if(i === idx) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  if(correct){
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const mult = multiplierFor(state.streak);
    const pts = Math.round(10 * mult);
    state.score += pts;
    state.roundResults[state.roundIndex] = 'correct';
    fb.className = 'feedback ok';
    fb.textContent = `✓ Correct! +${pts} pts (x${mult} streak bonus)`;
  } else {
    state.streak = 0;
    state.roundResults[state.roundIndex] = 'wrong';
    fb.className = 'feedback bad';
    fb.textContent = idx === -1 ? "⏱ Time's up! Streak reset." : "✗ Not quite. Streak reset.";
  }
  document.getElementById('options').appendChild(fb);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.style.marginTop = '10px';
  nextBtn.textContent = state.roundIndex < TOTAL_ROUNDS - 1 ? 'Next Lock →' : 'Crack the Vault →';
  nextBtn.onclick = advanceRound;
  document.getElementById('options').appendChild(nextBtn);
}

function advanceRound(){
  if(state.roundIndex < TOTAL_ROUNDS - 1){
    state.roundIndex += 1;
    state.screen = 'play';
    render();
  } else {
    state.screen = 'vault';
    render();
    submitScore();
  }
}

function renderVault(){
  const correctCount = state.roundResults.filter(r=>r==='correct').length;
  app.innerHTML = `
    <div class="brand"><h1>WORD <span class="glow">HEIST</span></h1></div>
    <div class="panel vault-scene">
      <span class="tag">Vault Status</span>
      <div class="vault-door">
        <div class="vault-ring" id="vaultRing">
          <div class="bolt" style="top:6px; left:50%; transform:translateX(-50%);"></div>
          <div class="bolt" style="bottom:6px; left:50%; transform:translateX(-50%);"></div>
          <div class="bolt" style="left:6px; top:50%; transform:translateY(-50%);"></div>
          <div class="bolt" style="right:6px; top:50%; transform:translateY(-50%);"></div>
          <div class="vault-center">💰</div>
        </div>
      </div>
      <div class="big-result" id="vaultResult">CRACKED!</div>
      <p>${escapeHtml(state.teamName)} answered <strong>${correctCount}/${TOTAL_ROUNDS}</strong> correctly.</p>
      <p class="dim">Best streak: ${state.bestStreak} 🔥 &nbsp;·&nbsp; Final score: ${state.score} pts</p>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-gold" onclick="goLeaderboard()">Leaderboard</button>
        <button class="btn btn-ghost" onclick="goTeam()">Play Again</button>
      </div>
    </div>
  `;
  setTimeout(() => {
    const ring = document.getElementById('vaultRing');
    if(ring) ring.classList.add('open');
  }, 400);
}

async function submitScore(){
  if(!supabaseReady) return;
  try{
    const { data: existing } = await supabase
      .from('leaderboard')
      .select('score')
      .eq('team_name', state.teamName)
      .maybeSingle();

    if(!existing || state.score > existing.score){
      await supabase.from('leaderboard').upsert({
        team_name: state.teamName,
        score: state.score,
        best_streak: state.bestStreak,
        updated_at: new Date().toISOString()
      }, { onConflict: 'team_name' });
    }
  }catch(e){ console.error('submitScore failed', e); }
}

function goLeaderboard(){ state.screen='leaderboard'; render(); }

async function renderLeaderboard(){
  app.innerHTML = `
    <div class="brand"><h1>🏆 <span class="glow">LEADERBOARD</span></h1><div class="sub">live across the crew</div></div>
    <div class="panel"><div id="lbList" class="center-note">Loading scores…</div></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="goTeam()">← Play Again</button>
      <button class="btn btn-gold" onclick="renderLeaderboard()">Refresh</button>
    </div>
    ${!supabaseReady ? `<div class="cfg-note">⚠ Leaderboard not connected. Add your Supabase URL and anon key at the top of the script.</div>` : ''}
  `;
  if(!supabaseReady) return;
  try{
    const { data, error } = await supabase
      .from('leaderboard')
      .select('team_name, score, best_streak')
      .order('score', { ascending: false })
      .limit(20);
    const listDiv = document.getElementById('lbList');
    if(error) throw error;
    if(!data || !data.length){
      listDiv.innerHTML = '<div class="center-note">No scores yet. Be the first crew!</div>';
      return;
    }
    listDiv.innerHTML = data.map((e,i) => `
      <div class="lb-row">
        <span class="lb-rank ${i===0?'gold':''}">#${i+1}</span>
        <span class="lb-name">${escapeHtml(e.team_name)}</span>
        <span class="lb-score">${e.score} pts</span>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('lbList').innerHTML = '<div class="center-note">Could not load leaderboard.</div>';
    console.error(e);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

render();
</script>
</body>
</html>
