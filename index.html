<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Academy — English League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0f1b2d;
    --navy-2: #16283f;
    --paper: #f5f7fb;
    --card: #ffffff;
    --ink: #101826;
    --muted: #64748b;
    --line: #e4e9f2;
    --accent: #2563eb;
    --accent-dim: #eef2ff;
    --gold: #eab308;
    --silver: #a3adc2;
    --bronze: #c2703d;
    --ok: #16a34a;
    --bad: #dc2626;
    --font-head: 'Manrope', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 16px 14px 50px;
  }
  .app{ max-width: 560px; margin:0 auto; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .crest{
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(135deg, var(--navy), var(--accent));
    display:flex; align-items:center; justify-content:center;
    font-size:1.1rem;
  }
  .brand h1{ font-family: var(--font-head); font-size:1.05rem; margin:0; font-weight:800; }
  .brand .sub{ font-size:0.68rem; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .nav-link{
    font-size:0.78rem; color: var(--accent); font-weight:600; cursor:pointer;
    background:none; border:none; padding:6px 10px;
  }

  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 18px; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(16,24,38,0.04);
  }
  .eyebrow{
    font-size: 0.7rem; font-weight:700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; display:block;
  }
  h2{ font-family: var(--font-head); font-size: 1.2rem; margin: 0 0 10px; font-weight:800; }
  h3{ font-family: var(--font-head); font-size: 1rem; margin: 0 0 8px; font-weight:700; }
  p{ line-height:1.6; margin: 0 0 10px; color: var(--ink); font-size:0.95rem; }
  p.muted{ color: var(--muted); font-size: 0.85rem; }

  input[type=text], input[type=password], select{
    width:100%; font-family: var(--font-body); font-size:1rem;
    padding: 12px 13px; border-radius: 8px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); margin-bottom: 10px;
  }
  input:focus, select:focus{ outline:none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .btn{
    font-family: var(--font-head); font-weight:700; font-size: 0.92rem;
    padding: 13px 16px; border-radius: 9px; border:none; cursor:pointer;
    width:100%; transition: filter .15s ease, transform .1s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--navy); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.15); }
  .btn-accent{ background: var(--accent); color:#fff; }
  .btn-accent:hover{ filter:brightness(1.1); }
  .btn-ghost{ background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
  .btn-danger{ background:#fff; border:1.5px solid var(--bad); color:var(--bad); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .role-card{
    display:flex; align-items:center; gap:14px; cursor:pointer;
    padding: 18px; margin-bottom:12px;
  }
  .role-card .icon{ font-size:1.8rem; }
  .role-card:hover{ border-color: var(--accent); }

  .team-swatch{
    width:22px; height:22px; border-radius:6px; display:inline-block; margin-right:8px; vertical-align:middle;
  }
  .team-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px; border: 1.5px solid var(--line); border-radius:10px; margin-bottom:8px;
  }
  .team-row-left{ display:flex; align-items:center; }
  .team-row .team-name{ font-weight:700; }
  .team-row .team-meta{ font-size:0.75rem; color:var(--muted); }

  .crest-circle{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family: var(--font-head); font-weight:800; font-size:0.9rem; margin-right:10px; flex-shrink:0;
  }

  .color-picker{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .color-dot{
    width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent;
  }
  .color-dot.selected{ border-color: var(--ink); }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.78rem; font-weight:700; padding: 5px 12px; border-radius:20px;
  }
  .status-open{ background: #dcfce7; color: var(--ok); }
  .status-closed{ background: #fee2e2; color: var(--bad); }

  .mc-option{
    display:block; width:100%; text-align:left;
    background: #fff; border: 1.5px solid var(--line); border-radius: 9px;
    padding: 13px 15px; margin-bottom: 9px; cursor:pointer;
    font-family: var(--font-body); font-size: 0.95rem; color: var(--ink);
  }
  .mc-option:hover{ border-color: var(--accent); }
  .mc-option.correct{ border-color: var(--ok); background: #f0fdf4; }
  .mc-option.wrong{ border-color: var(--bad); background: #fef2f2; }
  .mc-option:disabled{ pointer-events:none; }

  .feedback{
    font-size: 0.88rem; font-weight:600;
    padding: 11px 13px; border-radius: 9px; margin: 8px 0 4px;
  }
  .feedback.ok{ background: #f0fdf4; color: var(--ok); }
  .feedback.bad{ background: #fef2f2; color: var(--bad); }

  table.standings{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.standings th{
    text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.4px;
    color: var(--muted); padding: 6px 4px; border-bottom: 2px solid var(--line);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  table.standings td{ padding: 8px 4px; border-bottom: 1px solid var(--line); font-size:0.82rem; overflow:hidden; text-overflow:ellipsis; word-break:break-word; }
  table.standings tr:last-child td{ border-bottom:none; }
  .rank-medal{ font-size:1.1rem; }
  .streak-badge{
    font-size:0.72rem; background:#fff7ed; color:#c2703d; padding:2px 8px; border-radius:12px; font-weight:700;
  }

  .center-note{ text-align:center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  .divider{ height:1px; background:var(--line); margin: 14px 0; }

  .game-track{ display:flex; gap:6px; margin-bottom:14px; }
  .game-dot{
    flex:1; height:8px; border-radius:4px; background: var(--line);
  }
  .game-dot.done{ background: var(--ok); }
  .game-dot.active{ background: var(--accent); }

  .scramble-word{
    font-family: var(--font-head); font-size: 1.8rem; font-weight:800; letter-spacing:6px;
    text-align:center; padding: 18px 0; color: var(--navy);
  }

  .student-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px dashed var(--line); font-size:0.88rem;
  }
  .student-row:last-child{ border-bottom:none; }
  .code-chip{
    font-family:monospace; font-weight:700; letter-spacing:1px; background:var(--accent-dim); color:var(--accent);
    padding:2px 8px; border-radius:6px; font-size:0.82rem;
  }
  @keyframes pulseDanger {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .level-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; font-weight:700;
    background: var(--accent-dim); color: var(--accent); padding:2px 8px; border-radius:12px;
  }
  .heatmap-row{ display:flex; gap:3px; flex-wrap:wrap; margin-top:6px; }
  .heatmap-cell{ width:14px; height:14px; border-radius:3px; background: var(--line); }
  .heatmap-cell.played{ background: var(--ok); }
  .weak-tag{ font-size:0.72rem; background:#fef2f2; color:var(--bad); padding:2px 8px; border-radius:10px; }
  .certificate{
    text-align:center; padding: 30px 20px; border: 3px solid var(--gold);
    border-radius: 14px; background: linear-gradient(160deg, #fffbeb, #fff);
  }
  .certificate .cert-title{ font-family: var(--font-head); font-size:0.75rem; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
  .certificate .cert-team{ font-family: var(--font-head); font-size:1.6rem; font-weight:800; margin:10px 0; }
  .certificate .cert-medal{ font-size:3rem; margin: 6px 0; }

  /* ---------------- Podium (top 3 leaderboard) ---------------- */
  .podium-wrap{ display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:6px 0 22px; }
  .podium-card{
    position:relative; background:var(--card); border-radius:16px; padding:16px 8px 12px;
    text-align:center; flex:1; min-width:0; max-width:112px; border:2px solid var(--line);
    animation: podiumRise .5s ease both;
  }
  .podium-card.rank-1{ order:2; padding-top:24px; padding-bottom:16px; z-index:2; }
  .podium-card.rank-2{ order:1; }
  .podium-card.rank-3{ order:3; }
  .podium-crown{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:1.5rem; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.2)); }
  .podium-avatar{
    width:46px; height:46px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:800; color:#fff; font-size:1.05rem; box-shadow:0 2px 6px rgba(16,24,38,0.18);
  }
  .podium-card.rank-1 .podium-avatar{ width:58px; height:58px; font-size:1.25rem; }
  .podium-name{ font-weight:800; font-size:0.8rem; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .podium-sub{ font-size:0.66rem; color:var(--muted); margin-bottom:4px; min-height:12px; }
  .podium-score{ font-family:var(--font-head); font-weight:800; font-size:0.85rem; }
  .podium-rankchip{
    position:absolute; top:-10px; right:-6px; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:0.68rem; font-weight:800;
    color:#fff; box-shadow:0 2px 5px rgba(16,24,38,0.25);
  }
  .podium-glow-gold{ border-color:var(--gold); animation: podiumRise .5s ease both, glowPulseGold 2.2s ease-in-out infinite; }
  .podium-glow-silver{ border-color:var(--silver); animation: podiumRise .5s ease both, glowPulseSilver 2.2s ease-in-out infinite; }
  .podium-glow-bronze{ border-color:var(--bronze); animation: podiumRise .5s ease both, glowPulseBronze 2.2s ease-in-out infinite; }
  @keyframes podiumRise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes glowPulseGold{ 0%,100%{ box-shadow:0 0 0 0 rgba(234,179,8,0.45);} 50%{ box-shadow:0 0 16px 5px rgba(234,179,8,0.55);} }
  @keyframes glowPulseSilver{ 0%,100%{ box-shadow:0 0 0 0 rgba(163,173,194,0.4);} 50%{ box-shadow:0 0 14px 4px rgba(163,173,194,0.5);} }
  @keyframes glowPulseBronze{ 0%,100%{ box-shadow:0 0 0 0 rgba(194,112,61,0.4);} 50%{ box-shadow:0 0 14px 4px rgba(194,112,61,0.5);} }

  /* ---------------- Visual storytelling layer: confetti + toasts ---------------- */
  #fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-20px; width:9px; height:14px; opacity:0.95; border-radius:2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(110vh) rotate(540deg); opacity:0; }
  }
  .celebrate-toast{
    position:fixed; left:50%; top:18%; transform:translate(-50%,-20px) scale(0.85);
    background: linear-gradient(160deg, var(--navy), var(--navy-2));
    color:#fff; border-radius:18px; padding:18px 26px; text-align:center;
    box-shadow: 0 20px 50px rgba(15,27,45,0.45); z-index:10000;
    opacity:0; animation: toastPop 2.6s ease forwards;
    font-family: var(--font-head);
  }
  .celebrate-toast .ct-icon{ font-size:2.2rem; line-height:1; margin-bottom:6px; }
  .celebrate-toast .ct-title{ font-size:1.15rem; font-weight:800; }
  .celebrate-toast .ct-sub{ font-size:0.8rem; color:#cbd5e1; margin-top:2px; }
  @keyframes toastPop{
    0%{ opacity:0; transform:translate(-50%,-20px) scale(0.85); }
    12%{ opacity:1; transform:translate(-50%,0) scale(1.04); }
    20%{ transform:translate(-50%,0) scale(1); }
    82%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-8px) scale(0.97); }
  }
  .streak-flash{
    position:fixed; left:50%; bottom:14%; transform:translateX(-50%) scale(0.8);
    background: var(--gold); color:#1a1300; font-family:var(--font-head); font-weight:800;
    padding:8px 18px; border-radius:999px; font-size:0.95rem; z-index:10000;
    opacity:0; animation: streakPop 1.4s ease forwards; box-shadow:0 10px 24px rgba(234,179,8,0.5);
  }
  @keyframes streakPop{
    0%{ opacity:0; transform:translateX(-50%) scale(0.7); }
    18%{ opacity:1; transform:translateX(-50%) scale(1.12); }
    30%{ transform:translateX(-50%) scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; transform:translateX(-50%) translateY(-14px) scale(0.95); }
  }

  /* ---------------- Chat room ---------------- */
  .chat-scroll{ display:flex; flex-direction:column; gap:10px; padding:4px 2px 6px; }
  .chat-msg{ display:flex; gap:8px; max-width:88%; }
  .chat-msg.mine{ align-self:flex-end; flex-direction:row-reverse; }
  .chat-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-head); font-weight:800; font-size:0.78rem; color:#fff;
  }
  .chat-bubble{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 12px;
    position:relative; min-width:60px;
  }
  .chat-msg.mine .chat-bubble{ background: var(--accent-dim); border-color:#c7d7fe; }
  .chat-msg.role-teacher .chat-bubble{ border-color:var(--gold); background:#fffbeb; }
  .chat-meta-row{ display:flex; align-items:center; gap:6px; margin-bottom:2px; }
  .chat-sender{ font-weight:800; font-size:0.78rem; font-family:var(--font-head); }
  .chat-role-badge{
    font-size:0.62rem; font-weight:800; letter-spacing:0.3px; padding:1px 6px; border-radius:8px;
    background:var(--gold); color:#1a1300; text-transform:uppercase;
  }
  .chat-time{ font-size:0.66rem; color:var(--muted); }
  .chat-reply-quote{
    font-size:0.74rem; color:var(--muted); background:rgba(0,0,0,0.04); border-left:3px solid var(--accent);
    padding:4px 8px; border-radius:6px; margin-bottom:5px;
  }
  .chat-body{ font-size:0.88rem; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .chat-edited{ font-size:0.66rem; color:var(--muted); margin-left:4px; }
  .chat-reactions{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .chat-reaction-chip{
    font-size:0.72rem; background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:1px 7px; cursor:pointer; display:flex; align-items:center; gap:3px;
  }
  .chat-reaction-chip.mine{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:700; }
  .chat-action-row{ display:flex; gap:10px; margin-top:4px; }
  .chat-action-link{ font-size:0.68rem; color:var(--muted); cursor:pointer; }
  .chat-action-link:hover{ color:var(--accent); }
  .chat-react-picker{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:4px 8px; position:absolute; bottom:100%; margin-bottom:4px; box-shadow:0 8px 20px rgba(0,0,0,0.12); z-index:5;
  }
  .chat-react-picker span{ cursor:pointer; font-size:1.05rem; }
  .chat-composer-fixed{
    position: fixed; left:0; right:0; bottom:0; z-index:500;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 20px rgba(16,24,38,0.06);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    transition: bottom 0.08s ease-out;
  }
  .chat-composer-inner{ max-width:560px; margin:0 auto; }
  .chat-context-bar{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    background:var(--accent-dim); color:var(--accent); font-size:0.76rem;
    padding:7px 11px; border-radius:10px; margin-bottom:7px;
    border-left: 3px solid var(--accent);
  }
  .chat-context-bar .chat-action-link{ flex-shrink:0; font-size:0.9rem; line-height:1; opacity:0.7; }
  .chat-context-bar .chat-action-link:hover{ opacity:1; }
  .chat-input-row{ display:flex; gap:9px; align-items:flex-end; }
  .chat-input-row textarea{
    flex:1; margin-bottom:0; resize:none; max-height:120px;
    padding: 11px 16px; border-radius: 22px; border: 1.5px solid var(--line);
    background: var(--paper); font-family: var(--font-body); font-size: 0.94rem;
    line-height:1.35; transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .chat-input-row textarea:focus{
    outline:none; border-color: var(--accent); background:#fff;
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .chat-input-row textarea::placeholder{ color: var(--muted); }
  .chat-send-btn{
    flex-shrink:0; width:44px; height:44px; border-radius:50%; border:none;
    background: linear-gradient(150deg, var(--accent), #4f46e5);
    color:#fff; font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 12px rgba(37,99,235,0.35);
    transition: transform .1s ease, filter .15s ease, opacity .15s ease;
  }
  .chat-send-btn:hover{ filter:brightness(1.08); }
  .chat-send-btn:active{ transform: scale(0.92); }
  .chat-send-btn:disabled{ opacity:0.45; box-shadow:none; cursor:default; transform:none; }
  .chat-footnote{ text-align:center; font-size:0.68rem; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="fx-layer"></div>

<script>
/* ============================================================
   VISUAL STORYTELLING LAYER — confetti, celebration toasts, sound
   ============================================================ */
const FX_COLORS = ['#2563eb','#eab308','#16a34a','#dc2626','#a855f7','#0f1b2d'];
function fireConfetti(count){
  const layer = document.getElementById('fx-layer');
  if(!layer) return;
  count = count || 40;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const left = Math.random()*100;
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.35;
    piece.style.left = left + 'vw';
    piece.style.background = FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = delay + 's';
    if(Math.random() > 0.5) piece.style.borderRadius = '50%';
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), (duration+delay)*1000 + 200);
  }
}
function showCelebrateToast(icon, title, sub){
  const layer = document.getElementById('fx-layer');
  if(!layer) return;
  const toast = document.createElement('div');
  toast.className = 'celebrate-toast';
  toast.innerHTML = `<div class="ct-icon">${icon}</div><div class="ct-title">${escapeHtml(title)}</div>${sub?`<div class="ct-sub">${escapeHtml(sub)}</div>`:''}`;
  layer.appendChild(toast);
  setTimeout(() => toast.remove(), 2700);
}
function showStreakFlash(text){
  const layer = document.getElementById('fx-layer');
  if(!layer) return;
  const el = document.createElement('div');
  el.className = 'streak-flash';
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
let __audioCtx = null;
function playChime(notes){
  try{
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    let t = ctx.currentTime;
    notes.forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.24);
      t += 0.12;
    });

/* ============================================================
   MINIMAL SUPABASE REST CLIENT — no external library needed.
   ============================================================ */
function createMiniSupabase(url, key){
  const baseHeaders = {
    apikey: key,
    Authorization: 'Bearer ' + key,
    'Content-Type': 'application/json'
  };
  async function doFetch(path, options){
    const res = await fetch(url + '/rest/v1/' + path, options);
    if(!res.ok){
      const text = await res.text().catch(()=> '');
      throw new Error('Supabase REST error ' + res.status + ': ' + text);
    }
    if(res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  function from(table){
    let filters = [];
    let orderSpec = null;
    let limitSpec = null;
    function buildQuery(){
      const params = new URLSearchParams();
      filters.forEach(([col,op,val]) => params.append(col, op + '.' + val));
      if(orderSpec) params.append('order', orderSpec.col + '.' + (orderSpec.asc ? 'asc' : 'desc'));
      if(limitSpec) params.append('limit', limitSpec);
      const qs = params.toString();
      return table + (qs ? ('?' + qs) : '');
    }
    async function runSelect(){
      try{
        const data = await doFetch(buildQuery(), { headers: baseHeaders });
        return { data: data || [] };
      }catch(e){ return { data: null, error: e }; }
    }
    const builder = {
      select(){ return builder; },
      eq(col, val){ filters.push([col, 'eq', val]); return builder; },
      neq(col, val){ filters.push([col, 'neq', val]); return builder; },
      order(col, opts){ orderSpec = { col, asc: !!(opts && opts.ascending) }; return builder; },
      limit(n){ limitSpec = n; return builder; },
      maybeSingle: async () => {
        const { data, error } = await runSelect();
        if(error) return { data: null, error };
        return { data: (data && data[0]) || null };
      },
      then(resolve, reject){ runSelect().then(resolve, reject); },
      insert: async (row) => {
        try{
          const headers = Object.assign({}, baseHeaders, { Prefer: 'return=representation' });
          const data = await doFetch(table, { method:'POST', headers, body: JSON.stringify(row) });
          return { data };
        }
        catch(e){ return { error: e }; }
      },
      upsert: async (row, opts) => {
        try{
          let path = table;
          if(opts && opts.onConflict) path += '?on_conflict=' + encodeURIComponent(opts.onConflict);
          const headers = Object.assign({}, baseHeaders, { Prefer: 'resolution=merge-duplicates' });
          await doFetch(path, { method:'POST', headers, body: JSON.stringify(row) });
          return {};
        }catch(e){ return { error: e }; }
      },
      update(fields){
        const updFilters = [];
        const updBuilder = {
          eq(col, val){ updFilters.push([col,'eq',val]); return updBuilder; },
          then(resolve, reject){
            (async () => {
              try{
                const params = new URLSearchParams();
                updFilters.forEach(([c,op,v]) => params.append(c, op + '.' + v));
                await doFetch(table + '?' + params.toString(), { method:'PATCH', headers: baseHeaders, body: JSON.stringify(fields) });
                resolve({});
              }catch(e){ resolve({ error: e }); }
            })();
          }
        };
        return updBuilder;
      },
      delete(){
        const delFilters = [];
        const delBuilder = {
          eq(col, val){ delFilters.push([col,'eq',val]); return delBuilder; },
          then(resolve, reject){
            (async () => {
              try{
                const params = new URLSearchParams();
                delFilters.forEach(([c,op,v]) => params.append(c, op + '.' + v));
                await doFetch(table + '?' + params.toString(), { method:'DELETE', headers: baseHeaders });
                resolve({});
              }catch(e){ resolve({ error: e }); }
            })();
          }
        };
        return delBuilder;
      }
    };
    return builder;
  }
  return { from };
}

/* ============================================================
   RANDOM QUESTION POOLS — flattened, tagged, and shuffled per pick
   ============================================================ */
function buildPool(tier){
  const isHard = tier === 'hard';
  const mcq = isHard ? MCQ_BANK_B2 : MCQ_BANK;
  const fill = isHard ? FILL_BANK_B2 : FILL_BANK;
  const scramble = isHard ? SCRAMBLE_BANK_B2 : SCRAMBLE_BANK;
  const odd = isHard ? ODD_BANK_B2 : ODD_BANK;
  const tf = isHard ? TF_BANK_B2 : TF_BANK;
  const pool = [];
  mcq.forEach((item,i) => pool.push({ type:'mcq', key: (isHard?'mcqB2-':'mcq-')+i, data:item }));
  fill.forEach((item,i) => pool.push({ type:'fill', key: (isHard?'fillB2-':'fill-')+i, data:item }));
  scramble.forEach((item,i) => pool.push({ type:'scramble', key: (isHard?'scrambleB2-':'scramble-')+i, data:item }));
  odd.forEach((item,i) => pool.push({ type:'oddOneOut', key: (isHard?'oddB2-':'odd-')+i, data:item }));
  tf.forEach((item,i) => pool.push({ type:'truefalse', key: (isHard?'tfB2-':'tf-')+i, data:item }));
  return pool;
}
const NORMAL_POOL = buildPool('normal');

function pickDuelQuestions(n){
  const shuffled = [...ALL_POOL].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, Math.min(n, shuffled.length)).map(q => q.key);
}
function questionByKey(key){
  return ALL_POOL.find(q => q.key === key);
}

   been used (very unlikely at 30/day), allow repeats rather than break. */
function pickRandomQuestion(usedKeys, useHard){
  const pool = useHard ? HARD_POOL : NORMAL_POOL;
  let candidates = pool.filter(q => !usedKeys.has(q.key));
  if(!candidates.length) candidates = pool;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

/* ============================================================
   CLASS CHAT — open general chat for every student + the teacher.
   Auto-clears every Saturday at 1:00 AM (device local time).
   ============================================================ */
const CHAT_EMOJIS = ['👍','❤️','😂','🔥','👏','🎉'];
let __chatMessagesCache = [];
let __chatReactionsCache = [];
let __chatTeamColors = {};

function chatIdentity(){
  if(state.teacherAuthed) return { code:'teacher', name:'Teacher', role:'teacher', team:null };
  return { code: state.studentCode, name: state.studentName, role:'student', team: state.team ? state.team.team_name : null };
}

function mostRecentSaturday1am(){
  const now = new Date();
  const boundary = new Date(now);
  const day = boundary.getDay(); // 0 = Sun ... 6 = Sat
  const daysUntilSat = (6 - day + 7) % 7;
  boundary.setDate(boundary.getDate() + daysUntilSat);
  boundary.setHours(1,0,0,0);
  if(boundary > now) boundary.setDate(boundary.getDate() - 7);
  return boundary;
}

async function maybeResetWeeklyChat(){
  try{
    const boundary = mostRecentSaturday1am();
    const { data: meta } = await supabaseClient.from('chat_meta').select('*').eq('id',1).maybeSingle();
    const lastReset = meta && meta.last_reset ? new Date(meta.last_reset) : new Date(0);
    if(lastReset < boundary){
      await supabaseClient.from('chat_messages').delete();
      await supabaseClient.from('chat_reactions').delete();
      await supabaseClient.from('chat_meta').update({ last_reset: new Date().toISOString() }).eq('id', 1);
    }
  }catch(e){ /* non-fatal — chat still works even if the reset check fails */ }
}

async function renderChatRoom(){
  if(!state.teacherAuthed && !state.studentCode){ navigateTo('roleSelect'); return; }
  clearChatPoll();
  state.chatReplyTo = null;
  state.chatEditingId = null;
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Opening chat…</p></div>`;

  await maybeResetWeeklyChat();
  const { data: teams } = await supabaseClient.from('teams').select('*');
  __chatTeamColors = {};
  (teams||[]).forEach(t => { __chatTeamColors[t.team_name] = t.color; });

  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Class Chat</span>
      <h2 style="margin-bottom:2px;">💬 General Chat</h2>
      <p class="chat-footnote" style="margin:0 0 8px;">Everyone in class can see this. It clears automatically every Saturday at 1:00 AM.</p>
      <div class="chat-scroll" id="chatScroll"><p class="muted center-note">Loading messages…</p></div>
      <div id="chatBottomSpacer" style="height:70px;"></div>
    </div>
    <div class="chat-composer-fixed" id="chatComposerWrap"></div>
  `;
  await refreshChatMessages(true);
  renderChatComposer();
  startChatKeyboardWatcher();
  state.chatPollHandle = setInterval(() => refreshChatMessages(false), 3000);
}

async function refreshChatMessages(forceScroll){
  const scrollEl = document.getElementById('chatScroll');
  if(!scrollEl) return;
  const docEl = document.scrollingElement || document.documentElement;
  const wasNearBottom = docEl.scrollHeight - docEl.scrollTop - docEl.clientHeight < 120;
  const [{ data: messages }, { data: reactions }] = await Promise.all([
    supabaseClient.from('chat_messages').select('*').order('created_at', { ascending:true }),
    supabaseClient.from('chat_reactions').select('*')
  ]);
  __chatMessagesCache = messages || [];
  __chatReactionsCache = reactions || [];
  scrollEl.innerHTML = __chatMessagesCache.length
    ? __chatMessagesCache.map(m => chatMessageHtml(m)).join('')
    : '<p class="muted center-note">No messages yet — say hi! 👋</p>';
  wireChatMessageEvents();
  if(forceScroll || wasNearBottom){
    requestAnimationFrame(() => { docEl.scrollTop = docEl.scrollHeight; });
  }
}

function chatAvatarHtml(m){
  if(m.sender_role === 'teacher') return `<div class="chat-avatar" style="background:var(--navy);">🧑‍🏫</div>`;
  const color = (m.team_name && __chatTeamColors[m.team_name]) || '#94a3b8';
  const initial = ((m.sender_name||'?').trim()[0] || '?').toUpperCase();
  return `<div class="chat-avatar" style="background:${color};">${escapeHtml(initial)}</div>`;
}

function chatReactionSummary(msgId){
  const id = chatIdentity();
  const forMsg = __chatReactionsCache.filter(r => r.message_id === msgId);
  const byEmoji = {};
  forMsg.forEach(r => { (byEmoji[r.emoji] = byEmoji[r.emoji] || []).push(r.reactor_code); });
  return Object.entries(byEmoji).map(([emoji, codes]) => ({ emoji, count: codes.length, mine: codes.includes(id.code) }));
}

function chatMessageHtml(m){
  const id = chatIdentity();
  const mine = m.sender_code === id.code && m.sender_role === id.role;
  const replyMsg = m.reply_to_id ? __chatMessagesCache.find(x => x.id === m.reply_to_id) : null;
  const reactions = chatReactionSummary(m.id);
  const timeStr = new Date(m.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  return `
    <div class="chat-msg ${mine?'mine':''} ${m.sender_role==='teacher'?'role-teacher':''}">
      ${chatAvatarHtml(m)}
      <div style="max-width:100%;">
        <div class="chat-meta-row" style="${mine?'flex-direction:row-reverse;':''}">
          <span class="chat-sender">${escapeHtml(m.sender_name)}</span>
          ${m.sender_role==='teacher' ? '<span class="chat-role-badge">Teacher</span>' : (m.team_name ? `<span class="muted" style="font-size:0.68rem;">${escapeHtml(m.team_name)}</span>` : '')}
          <span class="chat-time">${timeStr}</span>
        </div>
        <div class="chat-bubble">
          ${replyMsg ? `<div class="chat-reply-quote">↩ ${escapeHtml(replyMsg.sender_name)}: ${escapeHtml(replyMsg.body.slice(0,70))}${replyMsg.body.length>70?'…':''}</div>` : (m.reply_to_id ? `<div class="chat-reply-quote">↩ original message deleted</div>` : '')}
          <div class="chat-body">${escapeHtml(m.body)}${m.edited ? '<span class="chat-edited">(edited)</span>' : ''}</div>
          ${reactions.length ? `<div class="chat-reactions">${reactions.map(r=>`<span class="chat-reaction-chip ${r.mine?'mine':''}" data-react-toggle="${m.id}|${r.emoji}">${r.emoji} ${r.count}</span>`).join('')}</div>` : ''}
        </div>
        <div class="chat-action-row" style="${mine?'flex-direction:row-reverse;':''}">
          <span class="chat-action-link" data-reply-id="${m.id}">Reply</span>
          <span class="chat-action-link" data-react-id="${m.id}">React</span>
          ${mine ? `<span class="chat-action-link" data-edit-id="${m.id}">Edit</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

function wireChatMessageEvents(){
  document.querySelectorAll('[data-reply-id]').forEach(el => {
    el.onclick = () => {
      const mid = Number(el.dataset.replyId);
      const m = __chatMessagesCache.find(x => x.id === mid);
      if(!m) return;
      state.chatEditingId = null;
      state.chatReplyTo = { id: m.id, name: m.sender_name, snippet: m.body.slice(0,60) };
      renderChatComposer();
      const ta = document.getElementById('chatInput'); if(ta) ta.focus();
    };
  });
  document.querySelectorAll('[data-edit-id]').forEach(el => {
    el.onclick = () => {
      const mid = Number(el.dataset.editId);
      const m = __chatMessagesCache.find(x => x.id === mid);
      if(!m) return;
      state.chatReplyTo = null;
      state.chatEditingId = m.id;
      renderChatComposer();
      const ta = document.getElementById('chatInput');
      if(ta){ ta.value = m.body; ta.focus(); autoGrowChatInput(ta); updateChatSendState(); }
    };
  });
  document.querySelectorAll('[data-react-id]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openReactPicker(el, Number(el.dataset.reactId)); };
  });
  document.querySelectorAll('[data-react-toggle]').forEach(el => {
    el.onclick = () => {
      const [mid, emoji] = el.dataset.reactToggle.split('|');
      toggleReaction(Number(mid), emoji);
    };
  });
}

function openReactPicker(anchorEl, msgId){
  closeReactPicker();
  const picker = document.createElement('div');
  picker.className = 'chat-react-picker';
  picker.id = 'activeReactPicker';
  picker.innerHTML = CHAT_EMOJIS.map(e => `<span data-pick-emoji="${e}">${e}</span>`).join('');
  anchorEl.style.position = 'relative';
  anchorEl.appendChild(picker);
  picker.querySelectorAll('[data-pick-emoji]').forEach(s => {
    s.onclick = (e) => { e.stopPropagation(); toggleReaction(msgId, s.dataset.pickEmoji); };
  });
  setTimeout(() => { document.addEventListener('click', closeReactPicker, { once:true }); }, 0);
}
function closeReactPicker(){
  const el = document.getElementById('activeReactPicker');
  if(el) el.remove();
}

async function toggleReaction(msgId, emoji){
  const id = chatIdentity();
  try{
    const { data: existing } = await supabaseClient.from('chat_reactions').select('*').eq('message_id', msgId).eq('reactor_code', id.code);
    const mine = (existing||[])[0];
    if(mine && mine.emoji === emoji){
      await supabaseClient.from('chat_reactions').delete().eq('message_id', msgId).eq('reactor_code', id.code);
    } else if(mine){
      await supabaseClient.from('chat_reactions').update({ emoji }).eq('message_id', msgId).eq('reactor_code', id.code);
    } else {
      await supabaseClient.from('chat_reactions').insert({ message_id: msgId, reactor_code: id.code, emoji });
    }
  }catch(e){ console.error('reaction failed', e); }
  await refreshChatMessages(false);
}

function renderChatComposer(){
  const wrap = document.getElementById('chatComposerWrap');
  if(!wrap) return;
  const contextBar = state.chatReplyTo
    ? `<div class="chat-context-bar"><span>↩ Replying to <strong>${escapeHtml(state.chatReplyTo.name)}</strong>: ${escapeHtml(state.chatReplyTo.snippet)}</span><span class="chat-action-link" onclick="cancelChatContext()">✕</span></div>`
    : state.chatEditingId
      ? `<div class="chat-context-bar"><span>✏️ Editing your message</span><span class="chat-action-link" onclick="cancelChatContext()">✕</span></div>`
      : '';
  wrap.innerHTML = `
    <div class="chat-composer-inner">
      ${contextBar}
      <div class="chat-input-row">
        <textarea id="chatInput" rows="1" maxlength="500" placeholder="Write a message…" oninput="autoGrowChatInput(this); updateChatSendState();"></textarea>
        <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.4 20.6L21 12 3.4 3.4 3.4 10.2 15.5 12 3.4 13.8Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  `;
  const ta = document.getElementById('chatInput');
  if(ta) ta.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); } };
  resizeChatSpacer();
}

function cancelChatContext(){
  state.chatReplyTo = null;
  state.chatEditingId = null;
  renderChatComposer();
}

function updateChatSendState(){
  const ta = document.getElementById('chatInput');
  const btn = document.getElementById('chatSendBtn');
  if(!ta || !btn) return;
  btn.disabled = ta.value.trim().length === 0;
}

function autoGrowChatInput(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  resizeChatSpacer();
}

/* Keep a spacer at the bottom of the messages list exactly as tall as the fixed composer bar,
   so the newest messages are never hidden behind it. */
function resizeChatSpacer(){
  const wrap = document.getElementById('chatComposerWrap');
  const spacer = document.getElementById('chatBottomSpacer');
  if(!wrap || !spacer) return;
  spacer.style.height = (wrap.offsetHeight + 12) + 'px';
}

/* Keep the fixed composer pinned just above the on-screen keyboard (using the VisualViewport API),
   and back at the bottom edge once the keyboard closes. */
function adjustChatComposerForKeyboard(){
  const wrap = document.getElementById('chatComposerWrap');
  if(!wrap || !window.visualViewport) return;
  const vv = window.visualViewport;
  const keyboardInset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  wrap.style.bottom = keyboardInset + 'px';
  resizeChatSpacer();
}
function startChatKeyboardWatcher(){
  window.addEventListener('resize', resizeChatSpacer);
  if(!window.visualViewport) return;
  window.visualViewport.addEventListener('resize', adjustChatComposerForKeyboard);
  window.visualViewport.addEventListener('scroll', adjustChatComposerForKeyboard);
  adjustChatComposerForKeyboard();
}
function stopChatKeyboardWatcher(){
  window.removeEventListener('resize', resizeChatSpacer);
  if(!window.visualViewport) return;
  window.visualViewport.removeEventListener('resize', adjustChatComposerForKeyboard);
  window.visualViewport.removeEventListener('scroll', adjustChatComposerForKeyboard);
}

async function sendChatMessage(){
  const ta = document.getElementById('chatInput');
  if(!ta) return;
  const text = ta.value.trim();
  if(!text) return;
  const id = chatIdentity();
  ta.disabled = true;
  try{
    if(state.chatEditingId){
      await supabaseClient.from('chat_messages').update({ body: text, edited: true, updated_at: new Date().toISOString() }).eq('id', state.chatEditingId).eq('sender_code', id.code);
      state.chatEditingId = null;
    } else {
      await supabaseClient.from('chat_messages').insert({
        sender_code: id.code, sender_name: id.name, sender_role: id.role, team_name: id.team,
        body: text, reply_to_id: state.chatReplyTo ? state.chatReplyTo.id : null
      });
      state.chatReplyTo = null;
    }
  }catch(e){ console.error('chat send failed', e); }
  ta.disabled = false;
  renderChatComposer();
  await refreshChatMessages(true);
}

function fireEmoji(streak){
  if(streak >= 15) return '🔥🔥🔥';
  if(streak >= 10) return '🔥🔥';
  if(streak >= 5) return '🔥';
  return streak > 0 ? '🔥' : '';
}

function shuffleLetters(word){
  let letters = word.split('');
  let attempts = 0;
  let result = word;
  while(result === word && attempts < 20){
    letters = [...letters].sort(() => Math.random() - 0.5);
    result = letters.join('');
    attempts++;
  }
  return result.toUpperCase();
}

/* ============================================================
   STATE (persisted to localStorage so refresh keeps your place)

const STORAGE_KEY = 'academy_state_v2';

function loadPersistedState(){

  catch(e){ return null; }
}
function persistState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({

      lastRole: state.lastRole, lastStudentCode: state.lastStudentCode, lastStudentName: state.lastStudentName,

let state = {
  screen: 'roleSelect',
  history: [],
  teacherAuthed: false,
  team: null,
  studentName: null,
  studentCode: null,
  lastRole: null,
  lastStudentCode: null,
  lastStudentName: null,
  chatPollHandle: null,
  chatReplyTo: null,
  chatEditingId: null
};

const app = document.getElementById('app');
function todayStr(){ return new Date().toISOString().slice(0,10); }

function clearChatPoll(){
  if(state.chatPollHandle){ clearInterval(state.chatPollHandle); state.chatPollHandle = null; }
  stopChatKeyboardWatcher();
}
function navigateTo(screen){
  clearChatPoll();
  if(state.screen && state.screen !== screen) state.history.push(state.screen);

  render();
}
function goBack(){

function render(){
  if(!supabaseReady && state.screen !== 'roleSelect'){

  }
  const map = {

  };
  try{
    const result = fn();
    if(result && typeof result.catch === 'function'){

function teamInitials(name){

}

/* Animated gold/silver/bronze podium for the top 3 of a leaderboard.
   entries: array of up to 3 { label, sub, score, color, initial }, already sorted 1st..3rd. */
function podiumHtml(entries){
  if(!entries || !entries.length) return '';

function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

/* ============================================================
   TEACHER INSIGHTS — MVP of the day, weak-spot report, streak calendar
   ============================================================ */
function insightsCardHtml(teamList, studentList, progressList, challenge){
  const todayDate = challenge.challenge_date;
  const codeToStudent = {};
  studentList.forEach(s => codeToStudent[s.code] = s);

  // Today's MVP per team (most points earned today)
  let mvpRows = '';
  if(todayDate){
    const todayRows = progressList.filter(p => p.challenge_date === todayDate);
    const pointsByCode = {};
    todayRows.forEach(p => { pointsByCode[p.code] = (pointsByCode[p.code]||0) + (p.points||0); });
    teamList.forEach(t => {
      const teamCodes = studentList.filter(s => s.team_name === t.team_name).map(s => s.code);
      let best = null, bestPts = 0;
      teamCodes.forEach(c => { if((pointsByCode[c]||0) > bestPts){ bestPts = pointsByCode[c]; best = c; } });
      if(best){
        mvpRows += `<div class="student-row"><span>${escapeHtml(t.team_name)}</span><span class="muted">🌟 ${escapeHtml(codeToStudent[best].student_name)} — ${bestPts} pts today</span></div>`;
      }
    });
  }

  // Weak-spot per student (lowest accuracy game_type, min 3 attempts)
  const byCodeType = {};
  progressList.forEach(p => {
    byCodeType[p.code] = byCodeType[p.code] || {};
    byCodeType[p.code][p.game_type] = byCodeType[p.code][p.game_type] || { correct:0, total:0 };
    byCodeType[p.code][p.game_type].total++;
    if(p.correct) byCodeType[p.code][p.game_type].correct++;
  });
  const typeLabels = { mcq:'Multiple Choice', fill:'Fill-in-Blank', scramble:'Scramble', oddOneOut:'Odd One Out', truefalse:'True/False' };
  let weakRows = '';
  studentList.forEach(s => {
    const types = byCodeType[s.code];
    if(!types) return;
    let weakest = null, weakestAcc = 1;
    Object.keys(types).forEach(t => {
      if(types[t].total >= 3){
        const acc = types[t].correct / types[t].total;
        if(acc < weakestAcc){ weakestAcc = acc; weakest = t; }
      }
    });
    if(weakest && weakestAcc < 0.6){
      weakRows += `<div class="student-row"><span>${escapeHtml(s.student_name)}</span><span class="weak-tag">Weak: ${typeLabels[weakest]||weakest} (${Math.round(weakestAcc*100)}%)</span></div>`;
    }
  });

  // Streak calendar: last 14 distinct challenge dates each team played
  const last14 = Array.from({length:14}, (_,i) => {
    const d = new Date(Date.now() - (13-i)*86400000);
    return d.toISOString().slice(0,10);
  });
  let calendarRows = '';
  teamList.forEach(t => {
    const teamCodes = new Set(studentList.filter(s => s.team_name === t.team_name).map(s => s.code));
    const playedDates = new Set(progressList.filter(p => teamCodes.has(p.code)).map(p => p.challenge_date));
    calendarRows += `
      <div style="margin-bottom:8px;">
        <span class="muted" style="font-size:0.8rem;">${escapeHtml(t.team_name)}</span>
        <div class="heatmap-row">
          ${last14.map(d => `<div class="heatmap-cell ${playedDates.has(d)?'played':''}" title="${d}"></div>`).join('')}
        </div>
      </div>
    `;
  });

  if(!mvpRows && !weakRows && !calendarRows) return '';

  return `
    <div class="card">
      <span class="eyebrow">Insights</span>
      <h2>Class Overview</h2>

function studentRosterHtml(studentList, teamList){
  const teamOptionsHtml = (selected) => `
    <option value="" ${!selected ? 'selected' : ''}>— Unassigned —</option>
    ${teamList.map(t => `<option value="${escapeHtml(t.team_name)}" ${selected===t.team_name?'selected':''}>${escapeHtml(t.team_name)}</option>`).join('')}
  `;
  const studentRowHtml = (s, color) => `
    <div class="team-row" style="padding:10px 12px;">
      <div class="team-row-left" style="min-width:0;">
        <div class="crest-circle" style="width:32px; height:32px; font-size:0.75rem; background:${color};">${escapeHtml((s.student_name.trim()[0]||'?').toUpperCase())}</div>
        <div style="min-width:0;">
          <div class="team-name" style="font-size:0.9rem;">${escapeHtml(s.student_name)}</div>
          <span class="code-chip">${escapeHtml(s.code)}</span>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
        <select onchange="assignStudentTeam('${escapeHtml(s.code)}', this.value)" style="margin-bottom:0; padding:6px 8px; font-size:0.78rem; width:auto; max-width:120px;">
          ${teamOptionsHtml(s.team_name)}
        </select>
        <button class="nav-link" style="color:var(--bad); padding:2px 4px;" onclick="deleteStudent('${escapeHtml(s.code)}')">✕</button>
      </div>
    </div>
  `;
  const groupHtml = (title, color, students) => `
    <div style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
        <span class="team-swatch" style="background:${color};"></span>
        <span style="font-family:var(--font-head); font-weight:700; font-size:0.82rem;">${escapeHtml(title)}</span>
        <span class="muted" style="font-size:0.74rem;">(${students.length})</span>
      </div>
      ${students.map(s => studentRowHtml(s, color)).join('')}
    </div>
  `;
  const sortedStudents = s => [...s].sort((a,b) => a.student_name.localeCompare(b.student_name));
  let html = '';
  const unassigned = sortedStudents(studentList.filter(s => !s.team_name));
  if(unassigned.length) html += groupHtml('Unassigned', '#94a3b8', unassigned);
  teamList.forEach(t => {
    const members = sortedStudents(studentList.filter(s => s.team_name === t.team_name));
    if(members.length) html += groupHtml(t.team_name, t.color, members);
  });
  return html;
}

function selectColor(el){
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));

}

async function addTeam(){
  const nameEl = document.getElementById('newTeamName');
  const maxEl = document.getElementById('newTeamMaxMembers');
  const resultEl = document.getElementById('newTeamResult');
  const name = nameEl.value.trim();
  const maxMembers = Math.max(1, parseInt(maxEl.value, 10) || 5);
  if(!name) return;
  resultEl.innerHTML = `<p class="muted">Adding…</p>`;
  const result = await supabaseClient.from('teams').insert({ team_name: name, color: selectedColor, max_members: maxMembers, total_score: 0, streak_days: 0 });
  if(result && result.error){
    resultEl.innerHTML = `<div class="feedback bad">Could not add team: ${escapeHtml(result.error.message || String(result.error))}</div>`;
    return;
  }
  renderTeacherDashboard();
}

async function updateMaxMembers(teamName){
  const input = document.getElementById('maxMembers-' + teamName);
  const val = Math.max(1, parseInt(input.value, 10) || 1);
  await supabaseClient.from('teams').update({ max_members: val }).eq('team_name', teamName);
  renderTeacherDashboard();
}

async function deleteTeam(name){
  if(!confirm('Remove team "' + name + '"? Students on this team will need to be reassigned. This cannot be undone.')) return;
  await supabaseClient.from('teams').delete().eq('team_name', name);
  renderTeacherDashboard();
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusing chars (0/O, 1/I)
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function addStudent(){
  const nameEl = document.getElementById('newStudentName');
  const name = nameEl.value.trim();
  const resultEl = document.getElementById('newStudentResult');
  if(!name) return;
  const code = generateCode();
  resultEl.innerHTML = `<p class="muted">Adding…</p>`;
  const result = await supabaseClient.from('student_codes').insert({ code, student_name: name, team_name: null });
  if(result && result.error){
    resultEl.innerHTML = `<div class="feedback bad">Could not add student: ${escapeHtml(result.error.message || String(result.error))}</div>`;
    return;
  }
  resultEl.innerHTML = `<div class="feedback ok">✓ Added! ${escapeHtml(name)}'s code is <strong>${code}</strong>. Now assign them to a team below.</div>`;
  nameEl.value = '';
  renderTeacherDashboard();
}

async function assignStudentTeam(code, teamName){
  if(teamName){
    const [{ data: team }, { data: students }] = await Promise.all([
      supabaseClient.from('teams').select('*').eq('team_name', teamName).maybeSingle(),
      supabaseClient.from('student_codes').select('*').eq('team_name', teamName)
    ]);
    const currentCount = (students || []).filter(s => s.code !== code).length;
    if(team && currentCount >= team.max_members){
      alert('Team "' + teamName + '" is full (' + team.max_members + ' students max). Increase its limit or pick another team.');
      renderTeacherDashboard();
      return;
    }
  }
  await supabaseClient.from('student_codes').update({ team_name: teamName || null }).eq('code', code);
  renderTeacherDashboard();
}

async function deleteStudent(code){
  if(!confirm('Remove this student code? They will no longer be able to log in with it.')) return;
  await supabaseClient.from('student_codes').delete().eq('code', code);
  renderTeacherDashboard();
}

async function submitCode(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('codeError');
  if(!code) return;
  errEl.innerHTML = '';
  try{
    const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', code).maybeSingle();
    if(!codeRow){ errEl.innerHTML = `<div class="feedback bad">That code isn't recognized. Check with your teacher.</div>`; return; }
    if(!codeRow.team_name){ errEl.innerHTML = `<div class="feedback bad">Hi ${escapeHtml(codeRow.student_name)}! Your teacher hasn't assigned you to a team yet. Check back soon.</div>`; return; }
    const { data: team } = await supabaseClient.from('teams').select('*').eq('team_name', codeRow.team_name).maybeSingle();
    if(!team){ errEl.innerHTML = `<div class="feedback bad">Your team could not be found. Ask your teacher to check.</div>`; return; }
    state.teacherAuthed = false;
    state.team = team;
    state.studentName = codeRow.student_name;
    state.studentCode = code;
    state.studentXP = codeRow.xp_points || 0;
    state.lastRole = 'student';
    state.lastStudentCode = code;
    state.lastStudentName = codeRow.student_name;
    persistState();
    navigateTo('studentHub');
  }catch(e){
    errEl.innerHTML = `<div class="feedback bad">Something went wrong. Try again.</div>`;
  }
}
