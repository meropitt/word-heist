<html lang="en">
<head>
<meta charset="UTF-8">

    --line: #e4e9f2;
    --accent: #2563eb;
    --accent-dim: #eef2ff;

    --silver: #a3adc2;

    --ok: #16a34a;
    --bad: #dc2626;

  .btn-accent{ background: var(--accent); color:#fff; }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;

    text-align:left; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.6px;

</style>

<script>
/* ============================================================

const SUPABASE_ANON_KEY = "sb_publishable_IHJz931f_p6eyWMLpJHong_bHvZ0aqI";

const TEACHER_PASSWORD = "academy2026"; // ⚠ change this before sharing with students

/* ============================================================
   MINIMAL SUPABASE REST CLIENT — no external library needed.
   ============================================================ */
function createMiniSupabase(url, key){
  const baseHeaders = {
    apikey: key,
    Authorization: 'Bearer ' + key,
    'Content-Type': 'application/json'
  };
  async function doFetch(path, options){
    const res = await fetch(url + '/rest/v1/' + path, options);
    if(!res.ok){
      const text = await res.text().catch(()=> '');
      throw new Error('Supabase REST error ' + res.status + ': ' + text);
    }
    if(res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  function from(table){
    let filters = [];
    let orderSpec = null;
    let limitSpec = null;
    function buildQuery(){
      const params = new URLSearchParams();
      filters.forEach(([col,op,val]) => params.append(col, op + '.' + val));
      if(orderSpec) params.append('order', orderSpec.col + '.' + (orderSpec.asc ? 'asc' : 'desc'));
      if(limitSpec) params.append('limit', limitSpec);
      const qs = params.toString();
      return table + (qs ? ('?' + qs) : '');
    }
    async function runSelect(){
      try{
        const data = await doFetch(buildQuery(), { headers: baseHeaders });
        return { data: data || [] };
      }catch(e){ return { data: null, error: e }; }
    }
    const builder = {
      select(){ return builder; },
      eq(col, val){ filters.push([col, 'eq', val]); return builder; },
      neq(col, val){ filters.push([col, 'neq', val]); return builder; },
      order(col, opts){ orderSpec = { col, asc: !!(opts && opts.ascending) }; return builder; },
      limit(n){ limitSpec = n; return builder; },
      maybeSingle: async () => {
        const { data, error } = await runSelect();
        if(error) return { data: null, error };
        return { data: (data && data[0]) || null };
      },
      then(resolve, reject){ runSelect().then(resolve, reject); },
      insert: async (row) => {
        try{ await doFetch(table, { method:'POST', headers: baseHeaders, body: JSON.stringify(row) }); return {}; }
        catch(e){ return { error: e }; }
      },
      upsert: async (row, opts) => {
        try{
          let path = table;
          if(opts && opts.onConflict) path += '?on_conflict=' + encodeURIComponent(opts.onConflict);
          const headers = Object.assign({}, baseHeaders, { Prefer: 'resolution=merge-duplicates' });
          await doFetch(path, { method:'POST', headers, body: JSON.stringify(row) });
          return {};
        }catch(e){ return { error: e }; }
      },
      update(fields){
        return {
          eq: async (col, val) => {
            try{
              const params = new URLSearchParams(); params.append(col, 'eq.' + val);
              await doFetch(table + '?' + params.toString(), { method:'PATCH', headers: baseHeaders, body: JSON.stringify(fields) });
              return {};
            }catch(e){ return { error: e }; }
          }
        };
      },
      delete(){
        return {
          eq: async (col, val) => {
            try{
              const params = new URLSearchParams(); params.append(col, 'eq.' + val);
              await doFetch(table + '?' + params.toString(), { method:'DELETE', headers: baseHeaders });
              return {};
            }catch(e){ return { error: e }; }
          }
        };
      }
    };
    return builder;
  }
  return { from };
}

let supabaseClient = null;
let supabaseReady = false;
function tryInitSupabase(){
  if(supabaseReady) return true;
  try{ supabaseClient = createMiniSupabase(SUPABASE_URL, SUPABASE_ANON_KEY); supabaseReady = true; return true; }
  catch(e){ console.error('Supabase init failed', e); }
  return false;
}
tryInitSupabase();

/* ============================================================
   QUESTION BANKS — three mini-games rotate through each day
   ============================================================ */
const MCQ_BANK = [
  { q: "Choose the correct word: \"She ___ to the store every day.\"", opts: ["go","goes","going","gone"], correct: 1 },
  { q: "What is the synonym of \"happy\"?", opts: ["sad","joyful","angry","tired"], correct: 1 },
  { q: "Fix the sentence: \"He don't like coffee.\"", opts: ["He doesn't like coffee.","He not like coffee.","He no likes coffee.","He isn't like coffee."], correct: 0 },
  { q: "What is the opposite of \"ancient\"?", opts: ["old","modern","dusty","historic"], correct: 1 },
  { q: "Choose the correct word: \"They ___ finished the project.\"", opts: ["has","have","having","haves"], correct: 1 },
  { q: "What does \"reluctant\" mean?", opts: ["excited","unwilling","confused","certain"], correct: 1 },
  { q: "Fix the sentence: \"I have went there yesterday.\"", opts: ["I have gone there yesterday.","I went there yesterday.","I have go there yesterday.","I going there yesterday."], correct: 1 },
  { q: "What is the synonym of \"quickly\"?", opts: ["slowly","rapidly","calmly","rarely"], correct: 1 },
  { q: "Choose the correct word: \"If I ___ rich, I would travel.\"", opts: ["am","was","were","be"], correct: 2 },
  { q: "What does \"betray\" mean?", opts: ["to help","to break someone's trust","to celebrate","to forgive"], correct: 1 },
  { q: "Fix the sentence: \"Where you are going?\"", opts: ["Where are you going?","Where you going are?","Where going you are?","Where you go?"], correct: 0 },
  { q: "What is the opposite of \"generous\"?", opts: ["kind","selfish","wealthy","friendly"], correct: 1 },
  { q: "Choose the correct word: \"By next year, I ___ my degree.\"", opts: ["will finish","will have finished","finished","am finishing"], correct: 1 },
  { q: "What does \"unmistakable\" mean?", opts: ["confusing","impossible to doubt","hidden","forgettable"], correct: 1 },
  { q: "What is the synonym of \"conclusion\"?", opts: ["question","outcome","mystery","beginning"], correct: 1 },
];

const FILL_BANK = [
  { prompt: "I usually ___ (drink) coffee in the morning.", answers: ["drink"] },
  { prompt: "She ___ (be) a doctor for ten years.", answers: ["has been"] },
  { prompt: "They ___ (not / like) horror movies.", answers: ["don't like","do not like"] },
  { prompt: "If it rains, we ___ (stay) home.", answers: ["will stay","stay"] },
  { prompt: "He is the ___ (tall) student in the class.", answers: ["tallest"] },
  { prompt: "I wish I ___ (have) more free time.", answers: ["had"] },
  { prompt: "This is the book ___ I told you about.", answers: ["that","which"] },
  { prompt: "By the time we arrived, the movie ___ (already / start).", answers: ["had already started","already started"] },
  { prompt: "She speaks English ___ (fluent).", answers: ["fluently"] },
  { prompt: "We have ___ (live) here since 2019.", answers: ["lived"] },
];

const SCRAMBLE_BANK = [
  { word: "happy", hint: "feeling joy" },
  { word: "quickly", hint: "in a fast way" },
  { word: "generous", hint: "willing to give" },
  { word: "ancient", hint: "very old" },
  { word: "reluctant", hint: "unwilling to do something" },
  { word: "conclusion", hint: "the end result of thinking" },
  { word: "betray", hint: "to break someone's trust" },
  { word: "unmistakable", hint: "impossible to doubt" },
  { word: "exhausted", hint: "very tired" },
  { word: "inconsistent", hint: "not matching or steady" },
];

const GAME_TYPES = ['mcq','fill','scramble'];
const TEAM_COLORS = ["#2563eb","#dc2626","#16a34a","#ea580c","#7c3aed","#0891b2","#c2703d","#4f46e5"];

function mcqForDay(dayIndex){ return MCQ_BANK[dayIndex % MCQ_BANK.length]; }
function fillForDay(dayIndex){ return FILL_BANK[dayIndex % FILL_BANK.length]; }
function scrambleForDay(dayIndex){ return SCRAMBLE_BANK[dayIndex % SCRAMBLE_BANK.length]; }

function shuffleLetters(word){
  let letters = word.split('');
  let attempts = 0;
  let result = word;
  while(result === word && attempts < 20){
    letters = [...letters].sort(() => Math.random() - 0.5);
    result = letters.join('');
    attempts++;
  }
  return result.toUpperCase();
}

/* ============================================================
   STATE (persisted to localStorage so refresh keeps your place)
   ============================================================ */
const STORAGE_KEY = 'academy_state_v2';

function loadPersistedState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function persistState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      screen: state.screen, history: state.history,
      teacherAuthed: state.teacherAuthed, studentCode: state.studentCode
    }));
  }catch(e){}
}

let state = {
  screen: 'roleSelect',
  history: [],
  teacherAuthed: false,
  team: null,
  studentName: null,
  studentCode: null
};

const app = document.getElementById('app');
function todayStr(){ return new Date().toISOString().slice(0,10); }

function navigateTo(screen){
  if(state.screen && state.screen !== screen) state.history.push(state.screen);
  state.screen = screen;
  persistState();
  render();
}
function goBack(){
  const prev = state.history.pop();
  state.screen = prev || 'roleSelect';
  persistState();
  render();
}

function render(){
  if(!supabaseReady && state.screen !== 'roleSelect'){
    app.innerHTML = `<div class="card"><p class="muted">Connecting…</p></div>`;
    setTimeout(render, 400);
    return;
  }
  const map = {
    roleSelect: renderRoleSelect,
    teacherLogin: renderTeacherLogin,
    teacherDashboard: renderTeacherDashboard,
    studentCodeEntry: renderStudentCodeEntry,
    studentChallenge: renderStudentChallenge,
    standings: renderStandings,
  };
  (map[state.screen] || renderRoleSelect)();
}

function topbar(){
  const showBack = state.screen !== 'roleSelect';
  return `
    <div class="topbar">
      <div class="brand">
        <div class="crest">🏆</div>
        <div><h1>The Academy</h1><div class="sub">English League</div></div>
      </div>
      ${showBack ? `<button class="nav-link" onclick="goBack()">← Back</button>` : ''}
    </div>
  `;
}

function teamInitials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}

/* ---------------- Role select ---------------- */
function renderRoleSelect(){
  app.innerHTML = `
    ${topbar()}
    <div class="card role-card" onclick="goStudentFlow()">
      <div class="icon">🧑‍🎓</div>
      <div><h3>I'm a Student</h3><p class="muted" style="margin:0;">Enter your code and play today's challenge.</p></div>
    </div>
    <div class="card role-card" onclick="goTeacherLogin()">
      <div class="icon">🧑‍🏫</div>
      <div><h3>I'm the Teacher</h3><p class="muted" style="margin:0;">Manage students, teams, and today's challenge.</p></div>
    </div>
    <div class="card" style="cursor:pointer;" onclick="goStandings()">
      <h3>🏅 View League Standings</h3>
      <p class="muted" style="margin:0;">See how every team is ranked right now.</p>
    </div>
  `;
}
function goStudentFlow(){ navigateTo('studentCodeEntry'); }
function goTeacherLogin(){ navigateTo('teacherLogin'); }
function goStandings(){ navigateTo('standings'); }
function goRoleSelect(){ state.screen='roleSelect'; state.history=[]; persistState(); render(); }

/* ---------------- Teacher login ---------------- */
function renderTeacherLogin(){
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Teacher Access</span>
      <h2>Enter password</h2>
      <input type="password" id="pwInput" placeholder="Password">
      <div id="pwError"></div>
      <button class="btn btn-primary" onclick="checkPassword()">Enter Dashboard</button>
    </div>
  `;
  document.getElementById('pwInput').focus();
  document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPassword(); });
}
function checkPassword(){
  const val = document.getElementById('pwInput').value;
  if(val === TEACHER_PASSWORD){ state.teacherAuthed = true; navigateTo('teacherDashboard'); }
  else document.getElementById('pwError').innerHTML = `<div class="feedback bad">Incorrect password.</div>`;
}
function teacherLogout(){ state.teacherAuthed = false; goRoleSelect(); }

/* ---------------- Teacher dashboard ---------------- */
let selectedColor = TEAM_COLORS[0];

async function renderTeacherDashboard(){
  if(!state.teacherAuthed){ navigateTo('teacherLogin'); return; }
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Loading dashboard…</p></div>`;

  const [{ data: teams }, { data: challengeRows }, { data: students }] = await Promise.all([
    supabaseClient.from('teams').select('*').order('created_at', { ascending:true }),
    supabaseClient.from('challenge_state').select('*').eq('id', 1).maybeSingle(),
    supabaseClient.from('student_codes').select('*').order('team_name', { ascending:true })
  ]);
  const challenge = challengeRows || { is_open:false, challenge_date:null, day_index:0 };
  const isOpenToday = challenge.is_open && challenge.challenge_date === todayStr();
  const teamList = teams || [];
  const studentList = students || [];

  app.innerHTML = `
    ${topbar()}
    <div style="text-align:right; margin-bottom:10px;">
      <button class="nav-link" onclick="teacherLogout()">Log out</button>
    </div>

    <div class="card">
      <span class="eyebrow">Today's Challenge</span>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <span class="status-pill ${isOpenToday ? 'status-open':'status-closed'}">${isOpenToday ? '● OPEN' : '● CLOSED'}</span>
        <span class="muted" style="font-size:0.8rem;">Day #${challenge.day_index + 1} · 3 mini-games</span>
      </div>
      ${isOpenToday
        ? `<button class="btn btn-danger" onclick="endChallenge()">End Today's Challenge</button>`
        : `<button class="btn btn-accent" onclick="startChallenge(${challenge.day_index})">▶ Start Today's Challenge</button>`
      }
    </div>

    <div class="card">
      <span class="eyebrow">Teams (${teamList.length})</span>
      <h2>Manage Teams</h2>
      <div id="teamsList">
        ${teamList.map(t => {
          const count = studentList.filter(s=>s.team_name===t.team_name).length;
          const full = count >= t.max_members;
          return `
          <div class="team-row" style="flex-direction:column; align-items:stretch; gap:8px;">
            <div style="display:flex; align-items:center; justify-content:space-between;">
              <div class="team-row-left">
                <div class="crest-circle" style="background:${t.color}">${teamInitials(t.team_name)}</div>
                <div>
                  <div class="team-name">${escapeHtml(t.team_name)}</div>
                  <div class="team-meta">${t.total_score} pts · 🔥${t.streak_days}d</div>
                </div>
              </div>
              <button class="nav-link" style="color:var(--bad);" onclick="deleteTeam('${escapeHtml(t.team_name).replace(/'/g,"\\'")}')">Remove</button>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="muted" style="font-size:0.82rem;">Students: <strong style="color:${full?'var(--bad)':'var(--ink)'};">${count} / </strong></span>
              <input type="number" min="1" max="99" value="${t.max_members}" id="maxMembers-${escapeHtml(t.team_name)}" style="width:70px; margin-bottom:0; padding:6px 8px; text-align:center;">
              <button class="nav-link" onclick="updateMaxMembers('${escapeHtml(t.team_name).replace(/'/g,"\\'")}')">Save</button>
            </div>
          </div>
        `;}).join('') || '<p class="muted">No teams yet — add your first team below.</p>'}
      </div>
      <div class="divider"></div>
      <h3>Add a Team</h3>
      <input type="text" id="newTeamName" placeholder="Team name (e.g. Falcons)" maxlength="24">
      <p class="muted" style="margin-bottom:8px;">Team color</p>
      <div class="color-picker" id="colorPicker">
        ${TEAM_COLORS.map((c,i) => `<div class="color-dot ${i===0?'selected':''}" style="background:${c}" data-color="${c}" onclick="selectColor(this)"></div>`).join('')}
      </div>
      <p class="muted" style="margin-bottom:8px;">Max students on this team</p>
      <input type="number" id="newTeamMaxMembers" min="1" max="99" value="5" style="max-width:100px;">
      <button class="btn btn-primary" onclick="addTeam()">Add Team</button>
    </div>

    <div class="card">
      <span class="eyebrow">Students (${studentList.length})</span>
      <h2>Manage Students</h2>
      <p class="muted">Add each student by name to generate their code, then assign them to a team. Students without a team yet can't start the challenge.</p>
      <div id="studentsList">
        ${studentList.length ? `
        <table class="standings">
          <tr><th>Student</th><th>Team</th><th>Code</th><th></th></tr>
          ${studentList.map(s => `
            <tr>
              <td>${escapeHtml(s.student_name)}</td>
              <td>
                <select onchange="assignStudentTeam('${escapeHtml(s.code)}', this.value)" style="margin-bottom:0; padding:6px 8px; font-size:0.85rem;">
                  <option value="" ${!s.team_name ? 'selected' : ''}>— Unassigned —</option>
                  ${teamList.map(t => `<option value="${escapeHtml(t.team_name)}" ${s.team_name===t.team_name?'selected':''}>${escapeHtml(t.team_name)}</option>`).join('')}
                </select>
              </td>
              <td><span class="code-chip">${escapeHtml(s.code)}</span></td>
              <td><button class="nav-link" style="color:var(--bad); padding:2px 4px;" onclick="deleteStudent('${escapeHtml(s.code)}')">✕</button></td>
            </tr>
          `).join('')}
        </table>
        ` : '<p class="muted">No students yet — add your first student below.</p>'}
      </div>
      <div class="divider"></div>
      <h3>Add a Student</h3>
      <input type="text" id="newStudentName" placeholder="Student name" maxlength="40">
      <button class="btn btn-primary" onclick="addStudent()">Add Student &amp; Generate Code</button>
      <div id="newStudentResult"></div>
    </div>

    <div class="card" style="cursor:pointer;" onclick="goStandings()">
      <h3>🏅 View Full Standings</h3>
      <p class="muted" style="margin:0;">Open the league table.</p>
    </div>
  `;
}

function selectColor(el){
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

async function addTeam(){
  const nameEl = document.getElementById('newTeamName');
  const maxEl = document.getElementById('newTeamMaxMembers');
  const name = nameEl.value.trim();
  const maxMembers = Math.max(1, parseInt(maxEl.value, 10) || 5);
  if(!name) return;
  try{
    await supabaseClient.from('teams').insert({ team_name: name, color: selectedColor, max_members: maxMembers, total_score: 0, streak_days: 0 });
    renderTeacherDashboard();
  }catch(e){ alert('Could not add team (maybe the name is already used).'); }
}

async function updateMaxMembers(teamName){
  const input = document.getElementById('maxMembers-' + teamName);
  const val = Math.max(1, parseInt(input.value, 10) || 1);
  await supabaseClient.from('teams').update({ max_members: val }).eq('team_name', teamName);
  renderTeacherDashboard();
}

async function deleteTeam(name){
  if(!confirm('Remove team "' + name + '"? Students on this team will need to be reassigned. This cannot be undone.')) return;
  await supabaseClient.from('teams').delete().eq('team_name', name);
  renderTeacherDashboard();
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusing chars (0/O, 1/I)
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function addStudent(){
  const nameEl = document.getElementById('newStudentName');
  const name = nameEl.value.trim();
  const resultEl = document.getElementById('newStudentResult');
  if(!name) return;
  const code = generateCode();
  resultEl.innerHTML = `<p class="muted">Adding…</p>`;
  const result = await supabaseClient.from('student_codes').insert({ code, student_name: name, team_name: null });
  if(result && result.error){
    resultEl.innerHTML = `<div class="feedback bad">Could not add student: ${escapeHtml(result.error.message || String(result.error))}</div>`;
    return;
  }
  resultEl.innerHTML = `<div class="feedback ok">✓ Added! ${escapeHtml(name)}'s code is <strong>${code}</strong>. Now assign them to a team below.</div>`;
  nameEl.value = '';
  renderTeacherDashboard();
}

async function assignStudentTeam(code, teamName){
  if(teamName){
    const [{ data: team }, { data: students }] = await Promise.all([
      supabaseClient.from('teams').select('*').eq('team_name', teamName).maybeSingle(),
      supabaseClient.from('student_codes').select('*').eq('team_name', teamName)
    ]);
    const currentCount = (students || []).filter(s => s.code !== code).length;
    if(team && currentCount >= team.max_members){
      alert('Team "' + teamName + '" is full (' + team.max_members + ' students max). Increase its limit or pick another team.');
      renderTeacherDashboard();
      return;
    }
  }
  await supabaseClient.from('student_codes').update({ team_name: teamName || null }).eq('code', code);
  renderTeacherDashboard();
}

async function deleteStudent(code){
  if(!confirm('Remove this student code? They will no longer be able to log in with it.')) return;
  await supabaseClient.from('student_codes').delete().eq('code', code);
  renderTeacherDashboard();
}

async function startChallenge(dayIndex){
  await supabaseClient.from('challenge_state').update({ is_open: true, challenge_date: todayStr(), day_index: dayIndex }).eq('id', 1);
  renderTeacherDashboard();
}
async function endChallenge(){
  await supabaseClient.from('challenge_state').update({ is_open: false }).eq('id', 1);
  renderTeacherDashboard();
}

/* ---------------- Student: enter code ---------------- */
function renderStudentCodeEntry(){
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Join Today's Challenge</span>
      <h2>Enter your student code</h2>
      <p class="muted">Your teacher gave you a personal code. It's linked to your team — you can't change teams yourself.</p>
      <input type="text" id="codeInput" placeholder="e.g. K7P2XQ" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; font-weight:700; text-align:center; font-size:1.2rem;">
      <div id="codeError"></div>
      <button class="btn btn-primary" onclick="submitCode()">Continue</button>
    </div>
  `;
  const input = document.getElementById('codeInput');
  input.focus();
  input.addEventListener('input', () => { input.value = input.value.toUpperCase(); });
  input.addEventListener('keydown', e => { if(e.key==='Enter') submitCode(); });
}

async function submitCode(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('codeError');
  if(!code) return;
  errEl.innerHTML = '';
  try{
    const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', code).maybeSingle();
    if(!codeRow){ errEl.innerHTML = `<div class="feedback bad">That code isn't recognized. Check with your teacher.</div>`; return; }
    if(!codeRow.team_name){ errEl.innerHTML = `<div class="feedback bad">Hi ${escapeHtml(codeRow.student_name)}! Your teacher hasn't assigned you to a team yet. Check back soon.</div>`; return; }
    const { data: team } = await supabaseClient.from('teams').select('*').eq('team_name', codeRow.team_name).maybeSingle();
    if(!team){ errEl.innerHTML = `<div class="feedback bad">Your team could not be found. Ask your teacher to check.</div>`; return; }
    state.team = team;
    state.studentName = codeRow.student_name;
    state.studentCode = code;
    navigateTo('studentChallenge');
  }catch(e){
    errEl.innerHTML = `<div class="feedback bad">Something went wrong. Try again.</div>`;
  }
}

/* ---------------- Student: today's multi-game challenge ---------------- */
async function renderStudentChallenge(){
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Checking today's challenge…</p></div>`;
  const { data: challenge } = await supabaseClient.from('challenge_state').select('*').eq('id',1).maybeSingle();
  const isOpenToday = challenge && challenge.is_open && challenge.challenge_date === todayStr();

  if(!isOpenToday){
    const { data: standingsData } = await supabaseClient.from('teams').select('*').order('total_score', { ascending:false }).limit(5);
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
          <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)}</p></div>
        </div>
        <span class="status-pill status-closed">● Waiting for your teacher</span>
        <p class="muted" style="margin-top:10px;">Today's challenge hasn't started yet. Ask your teacher to press "Start Today's Challenge."</p>
      </div>
      <div class="card">
        <h3>🏅 Top Teams Right Now</h3>
        ${miniStandingsRows(standingsData)}
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="goStandings()">View Full Standings</button>
      </div>
    `;
    return;
  }

  const dateStr = challenge.challenge_date;
  const { data: progressRows } = await supabaseClient.from('team_progress').select('*').eq('code', state.studentCode).eq('challenge_date', dateStr);
  const doneTypes = new Set((progressRows||[]).map(r => r.game_type));

  if(doneTypes.size >= GAME_TYPES.length){
    const correctCount = (progressRows||[]).filter(r=>r.correct).length;
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
          <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)}</p></div>
        </div>
        <div class="feedback ok">🎉 You finished today's challenge! ${correctCount}/${GAME_TYPES.length} correct.</div>
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="goStandings()">View Standings</button>
      </div>
    `;
    return;
  }

  const nextType = GAME_TYPES.find(t => !doneTypes.has(t));
  renderGameStage(challenge, dateStr, nextType, doneTypes);
}

function gameTrack(doneTypes, activeType){
  return `
    <div class="game-track">
      ${GAME_TYPES.map(t => {
        let cls = 'game-dot';
        if(doneTypes.has(t)) cls += ' done';
        else if(t === activeType) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('')}
    </div>
  `;
}

function renderGameStage(challenge, dateStr, gameType, doneTypes){
  const header = `
    ${topbar()}
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
        <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)} · Day #${challenge.day_index+1}</p></div>
      </div>
      ${gameTrack(doneTypes, gameType)}
  `;

  if(gameType === 'mcq'){
    const q = mcqForDay(challenge.day_index);
    app.innerHTML = header + `
      <span class="eyebrow">Multiple Choice</span>
      <h3>${q.q}</h3>
      <div id="gameArea"></div>
    </div>`;
    const area = document.getElementById('gameArea');
    q.opts.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'mc-option';
      b.textContent = opt;
      b.onclick = () => submitGameAnswer('mcq', idx === q.correct, dateStr, () => {
        const opts = document.querySelectorAll('.mc-option');
        opts.forEach((el,i)=>{ el.disabled=true; if(i===q.correct) el.classList.add('correct'); else if(i===idx) el.classList.add('wrong'); });
      });
      area.appendChild(b);
    });
    return;
  }

  if(gameType === 'fill'){
    const q = fillForDay(challenge.day_index);
    app.innerHTML = header + `
      <span class="eyebrow">Fill in the Blank</span>
      <h3>${q.prompt}</h3>
      <input type="text" id="fillInput" placeholder="Type your answer">
      <div id="gameArea"></div>
      <button class="btn btn-primary" id="fillSubmitBtn">Submit</button>
    </div>`;
    document.getElementById('fillInput').focus();
    document.getElementById('fillSubmitBtn').onclick = () => checkFillAnswer(q.answers, dateStr);
    document.getElementById('fillInput').addEventListener('keydown', e => { if(e.key==='Enter') checkFillAnswer(q.answers, dateStr); });
    return;
  }

  if(gameType === 'scramble'){
    const q = scrambleForDay(challenge.day_index);
    const scrambled = shuffleLetters(q.word);
    app.innerHTML = header + `
      <span class="eyebrow">Word Scramble</span>
      <p class="muted">Hint: ${escapeHtml(q.hint)}</p>
      <div class="scramble-word">${scrambled}</div>
      <input type="text" id="scrambleInput" placeholder="Unscramble the word">
      <div id="gameArea"></div>
      <button class="btn btn-primary" id="scrambleSubmitBtn">Submit</button>
    </div>`;
    document.getElementById('scrambleInput').focus();
    document.getElementById('scrambleSubmitBtn').onclick = () => checkScrambleAnswer(q.word, dateStr);
    document.getElementById('scrambleInput').addEventListener('keydown', e => { if(e.key==='Enter') checkScrambleAnswer(q.word, dateStr); });
    return;
  }
}

function checkFillAnswer(answers, dateStr){
  const val = document.getElementById('fillInput').value.trim().toLowerCase();
  const correct = answers.some(a => a.toLowerCase() === val);
  document.getElementById('fillInput').disabled = true;
  document.getElementById('fillSubmitBtn').disabled = true;
  submitGameAnswer('fill', correct, dateStr, () => {
    document.getElementById('gameArea').innerHTML =
      `<div class="feedback ${correct?'ok':'bad'}">${correct ? '✓ Correct!' : '✗ Not quite. Accepted answer: ' + escapeHtml(answers[0])}</div>`;
  });
}

function checkScrambleAnswer(word, dateStr){
  const val = document.getElementById('scrambleInput').value.trim().toLowerCase();
  const correct = val === word.toLowerCase();
  document.getElementById('scrambleInput').disabled = true;
  document.getElementById('scrambleSubmitBtn').disabled = true;
  submitGameAnswer('scramble', correct, dateStr, () => {
    document.getElementById('gameArea').innerHTML =
      `<div class="feedback ${correct?'ok':'bad'}">${correct ? '✓ Correct!' : '✗ Not quite. The word was: ' + escapeHtml(word)}</div>`;
  });
}

async function submitGameAnswer(gameType, correct, dateStr, uiUpdateFn){
  uiUpdateFn();
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
  fb.textContent = correct ? '✓ +15 points for ' + state.team.team_name : '✗ No points this round — nice try!';
  document.getElementById('gameArea').appendChild(fb);

  try{
    await supabaseClient.from('team_progress').insert({
      code: state.studentCode, challenge_date: dateStr, game_type: gameType, correct: correct
    });
    if(correct){
      const { data: teamRow } = await supabaseClient.from('teams').select('*').eq('team_name', state.team.team_name).maybeSingle();
      if(teamRow){
        const newScore = teamRow.total_score + 15;
        let newStreak = teamRow.streak_days;
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
        if(teamRow.last_played_date !== dateStr){
          newStreak = (teamRow.last_played_date === yesterday) ? teamRow.streak_days + 1 : 1;
        }
        await supabaseClient.from('teams').update({ total_score: newScore, streak_days: newStreak, last_played_date: dateStr }).eq('team_name', state.team.team_name);
        state.team.total_score = newScore;
        state.team.streak_days = newStreak;
      }
    }
  }catch(e){ console.error('submit failed', e); }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.style.marginTop = '10px';
  nextBtn.textContent = 'Continue →';
  nextBtn.onclick = () => renderStudentChallenge();
  document.getElementById('gameArea').appendChild(nextBtn);
}

function miniStandingsRows(teams){
  if(!teams || !teams.length) return '<p class="muted">No teams yet.</p>';
  const medals = ['🥇','🥈','🥉'];
  return teams.map((t,i) => `
    <div class="team-row">
      <div class="team-row-left">
        <span class="rank-medal" style="width:24px;">${medals[i]||('#'+(i+1))}</span>
        <div class="crest-circle" style="background:${t.color}; width:30px; height:30px; font-size:0.75rem;">${teamInitials(t.team_name)}</div>
        <div class="team-name">${escapeHtml(t.team_name)}</div>
      </div>
      <div class="team-meta" style="font-weight:700; color:var(--ink);">${t.total_score} pts</div>
    </div>
  `).join('');
}

/* ---------------- Standings ---------------- */
let standingsTab = 'teams';

async function renderStandings(){
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Loading league table…</p></div>`;

  if(standingsTab === 'teams'){
    const { data: teams } = await supabaseClient.from('teams').select('*').order('total_score', { ascending:false });
    const medals = ['🥇','🥈','🥉'];
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        <span class="eyebrow">League Table</span>
        <h2>Standings</h2>
        ${standingsTabs()}
        ${(teams && teams.length) ? `
          <table class="standings">
            <tr><th>#</th><th>Team</th><th>Streak</th><th style="text-align:right;">Points</th></tr>
            ${teams.map((t,i) => `
              <tr>
                <td>${medals[i] ? `<span class="rank-medal">${medals[i]}</span>` : (i+1)}</td>
                <td><span class="team-swatch" style="background:${t.color}"></span>${escapeHtml(t.team_name)}</td>
                <td>${t.streak_days > 0 ? `<span class="streak-badge">🔥 ${t.streak_days}d</span>` : '<span class="muted">—</span>'}</td>
                <td style="text-align:right; font-weight:700;">${t.total_score}</td>
              </tr>
            `).join('')}
          </table>
        ` : '<p class="muted">No teams yet.</p>'}
      </div>
    `;
    return;
  }

  // Student leaderboard: aggregate points per student from team_progress
  const [{ data: progress }, { data: students }] = await Promise.all([
    supabaseClient.from('team_progress').select('*'),
    supabaseClient.from('student_codes').select('*')
  ]);
  const pointsByCode = {};
  (progress || []).forEach(p => {
    if(p.correct) pointsByCode[p.code] = (pointsByCode[p.code] || 0) + 15;
  });
  const ranked = (students || [])
    .map(s => ({ name: s.student_name, team: s.team_name, points: pointsByCode[s.code] || 0 }))
    .sort((a,b) => b.points - a.points);
  const medals = ['🥇','🥈','🥉'];

  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Student Leaderboard</span>
      <h2>Top Students</h2>
      ${standingsTabs()}
      ${ranked.length ? `
        <table class="standings">
          <tr><th>#</th><th>Student</th><th>Team</th><th style="text-align:right;">Points</th></tr>
          ${ranked.map((s,i) => `
            <tr>
              <td>${medals[i] ? `<span class="rank-medal">${medals[i]}</span>` : (i+1)}</td>
              <td>${escapeHtml(s.name)}</td>
              <td class="muted">${s.team ? escapeHtml(s.team) : '—'}</td>
              <td style="text-align:right; font-weight:700;">${s.points}</td>
            </tr>
          `).join('')}
        </table>
      ` : '<p class="muted">No students yet.</p>'}
    </div>
  `;
}

function standingsTabs(){
  return `
    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn ${standingsTab==='teams' ? 'btn-primary' : 'btn-ghost'}" onclick="switchStandingsTab('teams')">🏆 Teams</button>
      <button class="btn ${standingsTab==='students' ? 'btn-primary' : 'btn-ghost'}" onclick="switchStandingsTab('students')">👤 Students</button>
    </div>
  `;
}
function switchStandingsTab(tab){ standingsTab = tab; renderStandings(); }

/* ============================================================
   BOOT — restore where the user left off on refresh
   ============================================================ */
async function boot(){
  const saved = loadPersistedState();
  if(saved){
    state.history = saved.history || [];
    state.teacherAuthed = !!saved.teacherAuthed;
    state.studentCode = saved.studentCode || null;

    if(saved.screen === 'teacherDashboard' && !state.teacherAuthed){
      state.screen = 'roleSelect'; state.history = [];
    } else if(saved.screen === 'studentChallenge' && state.studentCode){
      try{
        const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', state.studentCode).maybeSingle();
        if(codeRow){
          const { data: team } = await supabaseClient.from('teams').select('*').eq('team_name', codeRow.team_name).maybeSingle();
          if(team){ state.team = team; state.studentName = codeRow.student_name; state.screen = 'studentChallenge'; }
          else { state.screen = 'roleSelect'; state.history = []; }
        } else { state.screen = 'roleSelect'; state.history = []; }
      }catch(e){ state.screen = 'roleSelect'; state.history = []; }
    } else if(['studentCodeEntry','standings','teacherLogin','teacherDashboard'].includes(saved.screen)){
      state.screen = saved.screen;
    } else {
      state.screen = 'roleSelect'; state.history = [];
    }
  }
  render();
}
boot();
</script>
