    --muted: #64748b;

    --accent: #2563eb;

  .btn-accent{ background: var(--accent); color:#fff; }

/* ============================================================
   MINIMAL SUPABASE REST CLIENT — no external library needed.
   ============================================================ */
function createMiniSupabase(url, key){
  const baseHeaders = {
    apikey: key,
    Authorization: 'Bearer ' + key,
    'Content-Type': 'application/json'
  };
  async function doFetch(path, options){
    const res = await fetch(url + '/rest/v1/' + path, options);
    if(!res.ok){
      const text = await res.text().catch(()=> '');
      throw new Error('Supabase REST error ' + res.status + ': ' + text);
    }
    if(res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  function from(table){
    let filters = [];
    let orderSpec = null;
    let limitSpec = null;
    function buildQuery(){
      const params = new URLSearchParams();
      filters.forEach(([col,op,val]) => params.append(col, op + '.' + val));
      if(orderSpec) params.append('order', orderSpec.col + '.' + (orderSpec.asc ? 'asc' : 'desc'));
      if(limitSpec) params.append('limit', limitSpec);
      const qs = params.toString();
      return table + (qs ? ('?' + qs) : '');
    }
    async function runSelect(){
      try{
        const data = await doFetch(buildQuery(), { headers: baseHeaders });
        return { data: data || [] };
      }catch(e){ return { data: null, error: e }; }
    }
    const builder = {
      select(){ return builder; },
      eq(col, val){ filters.push([col, 'eq', val]); return builder; },
      neq(col, val){ filters.push([col, 'neq', val]); return builder; },
      order(col, opts){ orderSpec = { col, asc: !!(opts && opts.ascending) }; return builder; },
      limit(n){ limitSpec = n; return builder; },
      maybeSingle: async () => {
        const { data, error } = await runSelect();
        if(error) return { data: null, error };
        return { data: (data && data[0]) || null };
      },
      then(resolve, reject){ runSelect().then(resolve, reject); },
      insert: async (row) => {
        try{
          const headers = Object.assign({}, baseHeaders, { Prefer: 'return=representation' });
          const data = await doFetch(table, { method:'POST', headers, body: JSON.stringify(row) });
          return { data };
        }
        catch(e){ return { error: e }; }
      },
      upsert: async (row, opts) => {
        try{
          let path = table;
          if(opts && opts.onConflict) path += '?on_conflict=' + encodeURIComponent(opts.onConflict);
          const headers = Object.assign({}, baseHeaders, { Prefer: 'resolution=merge-duplicates' });
          await doFetch(path, { method:'POST', headers, body: JSON.stringify(row) });
          return {};
        }catch(e){ return { error: e }; }
      },
      update(fields){
        const updFilters = [];
        const updBuilder = {
          eq(col, val){ updFilters.push([col,'eq',val]); return updBuilder; },
          then(resolve, reject){
            (async () => {
              try{
                const params = new URLSearchParams();
                updFilters.forEach(([c,op,v]) => params.append(c, op + '.' + v));
                await doFetch(table + '?' + params.toString(), { method:'PATCH', headers: baseHeaders, body: JSON.stringify(fields) });
                resolve({});
              }catch(e){ resolve({ error: e }); }
            })();
          }
        };
        return updBuilder;
      },
      delete(){
        const delFilters = [];
        const delBuilder = {
          eq(col, val){ delFilters.push([col,'eq',val]); return delBuilder; },
          then(resolve, reject){
            (async () => {
              try{
                const params = new URLSearchParams();
                delFilters.forEach(([c,op,v]) => params.append(c, op + '.' + v));
                await doFetch(table + '?' + params.toString(), { method:'DELETE', headers: baseHeaders });
                resolve({});
              }catch(e){ resolve({ error: e }); }
            })();
          }
        };
        return delBuilder;
      }
    };
    return builder;
  }
  return { from };
}

/* ============================================================
   RANDOM QUESTION POOLS — flattened, tagged, and shuffled per pick
   ============================================================ */
function buildPool(tier){
  const isHard = tier === 'hard';
  const mcq = isHard ? MCQ_BANK_B2 : MCQ_BANK;
  const fill = isHard ? FILL_BANK_B2 : FILL_BANK;
  const scramble = isHard ? SCRAMBLE_BANK_B2 : SCRAMBLE_BANK;
  const odd = isHard ? ODD_BANK_B2 : ODD_BANK;
  const tf = isHard ? TF_BANK_B2 : TF_BANK;
  const pool = [];
  mcq.forEach((item,i) => pool.push({ type:'mcq', key: (isHard?'mcqB2-':'mcq-')+i, data:item }));
  fill.forEach((item,i) => pool.push({ type:'fill', key: (isHard?'fillB2-':'fill-')+i, data:item }));
  scramble.forEach((item,i) => pool.push({ type:'scramble', key: (isHard?'scrambleB2-':'scramble-')+i, data:item }));
  odd.forEach((item,i) => pool.push({ type:'oddOneOut', key: (isHard?'oddB2-':'odd-')+i, data:item }));
  tf.forEach((item,i) => pool.push({ type:'truefalse', key: (isHard?'tfB2-':'tf-')+i, data:item }));
  return pool;
}
const NORMAL_POOL = buildPool('normal');
const HARD_POOL = buildPool('hard');
const ALL_POOL = NORMAL_POOL.concat(HARD_POOL);

/* Pick N unique questions for a duel, fixed order, no repeats. */
function pickDuelQuestions(n){
  const shuffled = [...ALL_POOL].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, Math.min(n, shuffled.length)).map(q => q.key);
}
function questionByKey(key){
  return ALL_POOL.find(q => q.key === key);
}

const DUEL_QUESTION_COUNT = 40;
const DUEL_KICK_STREAK = 5;
const DUEL_POINTS = 10;

/* Pick a random question not already used today. If the whole pool has
   been used (very unlikely at 30/day), allow repeats rather than break. */
function pickRandomQuestion(usedKeys, useHard){
  const pool = useHard ? HARD_POOL : NORMAL_POOL;
  let candidates = pool.filter(q => !usedKeys.has(q.key));
  if(!candidates.length) candidates = pool;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function fireEmoji(streak){
  if(streak >= 15) return '🔥🔥🔥';

  return streak > 0 ? '🔥' : '';
}

function shuffleLetters(word){
  let letters = word.split('');
  let attempts = 0;
  let result = word;
  while(result === word && attempts < 20){
    letters = [...letters].sort(() => Math.random() - 0.5);
    result = letters.join('');
    attempts++;
  }
  return result.toUpperCase();
}

/* ============================================================
   TEACHER INSIGHTS — MVP of the day, weak-spot report, streak calendar
   ============================================================ */
function insightsCardHtml(teamList, studentList, progressList, challenge){
  const todayDate = challenge.challenge_date;
  const codeToStudent = {};
  studentList.forEach(s => codeToStudent[s.code] = s);

  // Today's MVP per team (most points earned today)
  let mvpRows = '';
  if(todayDate){
    const todayRows = progressList.filter(p => p.challenge_date === todayDate);
    const pointsByCode = {};
    todayRows.forEach(p => { pointsByCode[p.code] = (pointsByCode[p.code]||0) + (p.points||0); });
    teamList.forEach(t => {
      const teamCodes = studentList.filter(s => s.team_name === t.team_name).map(s => s.code);
      let best = null, bestPts = 0;
      teamCodes.forEach(c => { if((pointsByCode[c]||0) > bestPts){ bestPts = pointsByCode[c]; best = c; } });
      if(best){
        mvpRows += `<div class="student-row"><span>${escapeHtml(t.team_name)}</span><span class="muted">🌟 ${escapeHtml(codeToStudent[best].student_name)} — ${bestPts} pts today</span></div>`;
      }
    });
  }

  // Weak-spot per student (lowest accuracy game_type, min 3 attempts)
  const byCodeType = {};
  progressList.forEach(p => {
    byCodeType[p.code] = byCodeType[p.code] || {};
    byCodeType[p.code][p.game_type] = byCodeType[p.code][p.game_type] || { correct:0, total:0 };
    byCodeType[p.code][p.game_type].total++;
    if(p.correct) byCodeType[p.code][p.game_type].correct++;
  });
  const typeLabels = { mcq:'Multiple Choice', fill:'Fill-in-Blank', scramble:'Scramble', oddOneOut:'Odd One Out', truefalse:'True/False' };
  let weakRows = '';
  studentList.forEach(s => {
    const types = byCodeType[s.code];
    if(!types) return;
    let weakest = null, weakestAcc = 1;
    Object.keys(types).forEach(t => {
      if(types[t].total >= 3){
        const acc = types[t].correct / types[t].total;
        if(acc < weakestAcc){ weakestAcc = acc; weakest = t; }
      }
    });
    if(weakest && weakestAcc < 0.6){
      weakRows += `<div class="student-row"><span>${escapeHtml(s.student_name)}</span><span class="weak-tag">Weak: ${typeLabels[weakest]||weakest} (${Math.round(weakestAcc*100)}%)</span></div>`;
    }
  });

  // Streak calendar: last 14 distinct challenge dates each team played
  const last14 = Array.from({length:14}, (_,i) => {
    const d = new Date(Date.now() - (13-i)*86400000);
    return d.toISOString().slice(0,10);
  });
  let calendarRows = '';
  teamList.forEach(t => {
    const teamCodes = new Set(studentList.filter(s => s.team_name === t.team_name).map(s => s.code));
    const playedDates = new Set(progressList.filter(p => teamCodes.has(p.code)).map(p => p.challenge_date));
    calendarRows += `
      <div style="margin-bottom:8px;">
        <span class="muted" style="font-size:0.8rem;">${escapeHtml(t.team_name)}</span>
        <div class="heatmap-row">
          ${last14.map(d => `<div class="heatmap-cell ${playedDates.has(d)?'played':''}" title="${d}"></div>`).join('')}
        </div>
      </div>
    `;
  });

  if(!mvpRows && !weakRows && !calendarRows) return '';

  return `
    <div class="card">
      <span class="eyebrow">Insights</span>
      <h2>Class Overview</h2>
      ${mvpRows ? `<h3 style="margin-top:6px;">🌟 Today's MVPs</h3>${mvpRows}` : ''}
      ${weakRows ? `<div class="divider"></div><h3>🎯 Needs Practice</h3>${weakRows}` : ''}
      ${calendarRows ? `<div class="divider"></div><h3>📅 Play Streak (last 14 days)</h3>${calendarRows}` : ''}
    </div>
  `;
}

  const maxMembers = Math.max(1, parseInt(maxEl.value, 10) || 5);
  if(!name) return;
  resultEl.innerHTML = `<p class="muted">Adding…</p>`;
  const result = await supabaseClient.from('teams').insert({ team_name: name, color: selectedColor, max_members: maxMembers, total_score: 0, streak_days: 0 });
  if(result && result.error){
    resultEl.innerHTML = `<div class="feedback bad">Could not add team: ${escapeHtml(result.error.message || String(result.error))}</div>`;
    return;
  }
  renderTeacherDashboard();
}

async function updateMaxMembers(teamName){
  const input = document.getElementById('maxMembers-' + teamName);
  const val = Math.max(1, parseInt(input.value, 10) || 1);
  await supabaseClient.from('teams').update({ max_members: val }).eq('team_name', teamName);
  renderTeacherDashboard();
}

async function deleteTeam(name){
  if(!confirm('Remove team "' + name + '"? Students on this team will need to be reassigned. This cannot be undone.')) return;
  await supabaseClient.from('teams').delete().eq('team_name', name);
  renderTeacherDashboard();
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no confusing chars (0/O, 1/I)
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function addStudent(){
  const nameEl = document.getElementById('newStudentName');
  const name = nameEl.value.trim();
  const resultEl = document.getElementById('newStudentResult');
  if(!name) return;
  const code = generateCode();
  resultEl.innerHTML = `<p class="muted">Adding…</p>`;
  const result = await supabaseClient.from('student_codes').insert({ code, student_name: name, team_name: null });
  if(result && result.error){
    resultEl.innerHTML = `<div class="feedback bad">Could not add student: ${escapeHtml(result.error.message || String(result.error))}</div>`;
    return;
  }
  resultEl.innerHTML = `<div class="feedback ok">✓ Added! ${escapeHtml(name)}'s code is <strong>${code}</strong>. Now assign them to a team below.</div>`;
  nameEl.value = '';
  renderTeacherDashboard();
}

async function assignStudentTeam(code, teamName){
  if(teamName){
    const [{ data: team }, { data: students }] = await Promise.all([
      supabaseClient.from('teams').select('*').eq('team_name', teamName).maybeSingle(),
      supabaseClient.from('student_codes').select('*').eq('team_name', teamName)
    ]);
    const currentCount = (students || []).filter(s => s.code !== code).length;
    if(team && currentCount >= team.max_members){
      alert('Team "' + teamName + '" is full (' + team.max_members + ' students max). Increase its limit or pick another team.');
      renderTeacherDashboard();
      return;
    }
  }
  await supabaseClient.from('student_codes').update({ team_name: teamName || null }).eq('code', code);
  renderTeacherDashboard();
}

async function deleteStudent(code){
  if(!confirm('Remove this student code? They will no longer be able to log in with it.')) return;
  await supabaseClient.from('student_codes').delete().eq('code', code);
  renderTeacherDashboard();
}

async function startChallenge(dayIndex){
  await supabaseClient.from('challenge_state').update({ is_open: true, challenge_date: todayStr(), day_index: dayIndex }).eq('id', 1);
  renderTeacherDashboard();
}
async function endChallenge(){
  await supabaseClient.from('challenge_state').update({ is_open: false }).eq('id', 1);
  renderTeacherDashboard();
}

function renderStudentCodeEntry(){
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Join Today's Challenge</span>
      <h2>Enter your student code</h2>
      <p class="muted">Your teacher gave you a personal code. It's linked to your team — you can't change teams yourself.</p>
      <input type="text" id="codeInput" placeholder="e.g. K7P2XQ" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; font-weight:700; text-align:center; font-size:1.2rem;">
      <div id="codeError"></div>
      <button class="btn btn-primary" onclick="submitCode()">Continue</button>
    </div>
  `;

  input.addEventListener('keydown', e => { if(e.key==='Enter') submitCode(); });

async function submitCode(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('codeError');
  if(!code) return;
  errEl.innerHTML = '';
  try{
    const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', code).maybeSingle();
    if(!codeRow){ errEl.innerHTML = `<div class="feedback bad">That code isn't recognized. Check with your teacher.</div>`; return; }
    if(!codeRow.team_name){ errEl.innerHTML = `<div class="feedback bad">Hi ${escapeHtml(codeRow.student_name)}! Your teacher hasn't assigned you to a team yet. Check back soon.</div>`; return; }
    const { data: team } = await supabaseClient.from('teams').select('*').eq('team_name', codeRow.team_name).maybeSingle();
    if(!team){ errEl.innerHTML = `<div class="feedback bad">Your team could not be found. Ask your teacher to check.</div>`; return; }
    state.team = team;
    state.studentName = codeRow.student_name;
    state.studentCode = code;
    state.studentXP = codeRow.xp_points || 0;
    navigateTo('studentHub');
  }catch(e){
    errEl.innerHTML = `<div class="feedback bad">Something went wrong. Try again.</div>`;
  }
}

/* ---------------- Student: today's multi-game challenge ---------------- */
async function renderStudentChallenge(){
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Checking today's challenge…</p></div>`;
  const { data: challenge } = await supabaseClient.from('challenge_state').select('*').eq('id',1).maybeSingle();
  const isOpenToday = challenge && challenge.is_open && challenge.challenge_date === todayStr();

  if(!isOpenToday){
    const { data: standingsData } = await supabaseClient.from('teams').select('*').order('total_score', { ascending:false }).limit(5);
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
          <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)}</p></div>
        </div>
        <span class="status-pill status-closed">● Waiting for your teacher</span>
        <p class="muted" style="margin-top:10px;">Today's challenge hasn't started yet. Ask your teacher to press "Start Today's Challenge."</p>
      </div>
      <div class="card">
        <h3>🏅 Top Teams Right Now</h3>
        ${miniStandingsRows(standingsData)}
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="goStandings()">View Full Standings</button>
      </div>
    `;
    return;
  }

  const dateStr = challenge.challenge_date;
  const [{ data: progressRows }, { data: skipRows }] = await Promise.all([
    supabaseClient.from('team_progress').select('*').eq('code', state.studentCode).eq('challenge_date', dateStr),
    supabaseClient.from('skip_log').select('*').eq('code', state.studentCode).eq('challenge_date', dateStr)
  ]);
  const rows = progressRows || [];
  const skips = skipRows || [];
  const answeredCount = rows.length;
  const correctCount = rows.filter(r=>r.correct).length;
  const wrongCount = rows.filter(r=>!r.correct && !r.is_bonus).length;
  const skipsUsed = skips.length;

  const headerInfo = `
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
      <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)} · Day #${challenge.day_index+1}</p>${levelBadgeHtml(state.studentXP||0)}</div>
    </div>
  `;

  if(wrongCount >= DAILY_WRONG_LIMIT){
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        ${headerInfo}
        <div class="feedback bad">✗ You've used all ${DAILY_WRONG_LIMIT} of today's wrong answers. Come back for a new challenge tomorrow!</div>
        <p class="muted" style="margin-top:8px;">Today's result: ${correctCount} correct out of ${answeredCount} answered.</p>
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="goStandings()">View Standings</button>
      </div>
    `;
    return;
  }

  if(answeredCount >= DAILY_QUESTION_LIMIT){
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        ${headerInfo}
        <div class="feedback ok">🎉 You finished today's ${DAILY_QUESTION_LIMIT} questions! ${correctCount}/${DAILY_QUESTION_LIMIT} correct.</div>
        <button class="btn btn-ghost" style="margin-top:10px;" onclick="goStandings()">View Standings</button>
      </div>
    `;
    return;
  }

  const usedKeys = new Set(rows.map(r => r.question_key));
  const trailingStreak = computeTrailingStreak(rows);
  const useHard = trailingStreak >= HARD_MODE_STREAK;
  const isBonus = answeredCount === 0; // first question of the day is the Mystery Bonus
  const picked = pickRandomQuestion(usedKeys, useHard);
  renderQuestionCard(challenge, dateStr, picked, useHard, isBonus, { answeredCount, correctCount, wrongCount, skipsUsed, trailingStreak });
}

function computeTrailingStreak(rows){
  const sorted = [...rows].sort((a,b) => a.question_number - b.question_number);
  let streak = 0;
  for(let i = sorted.length - 1; i >= 0; i--){
    if(sorted[i].correct) streak++; else break;
  }
  return streak;
}

function statsBar(stats, useHard, isBonus){
  const skipsLeft = DAILY_SKIP_LIMIT - stats.skipsUsed;
  const danger = stats.wrongCount >= 4;
  const fire = fireEmoji(stats.trailingStreak);
  const toHard = Math.max(0, HARD_MODE_STREAK - stats.trailingStreak);
  return `
    <div style="display:flex; justify-content:space-between; align-items:center; font-family: var(--font-body); color: var(--muted); font-size:0.8rem; margin-bottom:6px;">
      <span>Question ${stats.answeredCount+1}/${DAILY_QUESTION_LIMIT} ${fire ? '<span style="font-size:1rem;">'+fire+'</span>' : ''}</span>
      <span style="${danger ? 'color:var(--bad); font-weight:800; animation: pulseDanger 1s infinite;' : ''}">❌ ${stats.wrongCount}/${DAILY_WRONG_LIMIT} &nbsp;·&nbsp; ⏭ ${skipsLeft} left</span>
    </div>
    ${danger ? `<div class="feedback bad" style="margin-bottom:8px;">⚠ One more mistake and today's challenge locks!</div>` : ''}
    ${isBonus ? `<div class="status-pill" style="background:#fef9c3; color:#854d0e; margin-bottom:8px; border:1px solid #eab308;">🎁 Mystery Bonus — double points, no penalty if wrong!</div>` : ''}
    ${useHard ? `<div class="status-pill" style="background:#fef3c7; color:#92400e; margin-bottom:10px;">⭐ Bonus Round — Harder Question (+${POINTS_HARD} pts)</div>` :
      (toHard > 0 && stats.trailingStreak > 0 ? `<p class="muted" style="font-size:0.78rem; margin-bottom:8px;">🔥 ${toHard} more correct in a row → Bonus Round!</p>` : '')}
  `;
}

function renderQuestionCard(challenge, dateStr, picked, useHard, isBonus, stats){
  const header = `
    ${topbar()}
    <div class="card">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <div class="crest-circle" style="background:${state.team.color}">${teamInitials(state.team.team_name)}</div>
        <div><h2 style="margin:0;">${escapeHtml(state.studentName)}</h2><p class="muted" style="margin:0;">${escapeHtml(state.team.team_name)} · Day #${challenge.day_index+1}</p>${levelBadgeHtml(state.studentXP||0)}</div>
      </div>
      ${statsBar(stats, useHard, isBonus)}
  `;
  const q = picked.data;

  if(picked.type === 'mcq'){
    app.innerHTML = header + `
      <span class="eyebrow">Multiple Choice</span>
      <h3>${q.q}</h3>
      <div id="gameArea"></div>
    </div>` + skipButtonHtml(stats.skipsUsed);
    const area = document.getElementById('gameArea');
    q.opts.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'mc-option';
      b.textContent = opt;
      b.onclick = () => submitGameAnswer(picked, idx === q.correct, dateStr, useHard, isBonus, stats, () => {
        const opts = document.querySelectorAll('.mc-option');
        opts.forEach((el,i)=>{ el.disabled=true; if(i===q.correct) el.classList.add('correct'); else if(i===idx) el.classList.add('wrong'); });
      });
      area.appendChild(b);
    });
    wireSkipButton(dateStr, stats);
    return;
  }

  if(picked.type === 'fill'){
    app.innerHTML = header + `
      <span class="eyebrow">Fill in the Blank</span>
      <h3>${q.prompt}</h3>
      <input type="text" id="fillInput" placeholder="Type your answer">
      <div id="gameArea"></div>
      <button class="btn btn-primary" id="fillSubmitBtn">Submit</button>
    </div>` + skipButtonHtml(stats.skipsUsed);
    document.getElementById('fillInput').focus();
    document.getElementById('fillSubmitBtn').onclick = () => checkFillAnswer(picked, dateStr, useHard, isBonus, stats);
    document.getElementById('fillInput').addEventListener('keydown', e => { if(e.key==='Enter') checkFillAnswer(picked, dateStr, useHard, isBonus, stats); });
    wireSkipButton(dateStr, stats);
    return;
  }

  if(picked.type === 'scramble'){
    const scrambled = shuffleLetters(q.word);
    app.innerHTML = header + `
      <span class="eyebrow">Word Scramble</span>
      <p class="muted">Hint: ${escapeHtml(q.hint)}</p>
      <div class="scramble-word">${scrambled}</div>
      <input type="text" id="scrambleInput" placeholder="Unscramble the word">
      <div id="gameArea"></div>
      <button class="btn btn-primary" id="scrambleSubmitBtn">Submit</button>
    </div>` + skipButtonHtml(stats.skipsUsed);
    document.getElementById('scrambleInput').focus();
    document.getElementById('scrambleSubmitBtn').onclick = () => checkScrambleAnswer(picked, dateStr, useHard, isBonus, stats);
    document.getElementById('scrambleInput').addEventListener('keydown', e => { if(e.key==='Enter') checkScrambleAnswer(picked, dateStr, useHard, isBonus, stats); });
    wireSkipButton(dateStr, stats);
    return;
  }

  if(picked.type === 'oddOneOut'){
    app.innerHTML = header + `
      <span class="eyebrow">Odd One Out</span>
      <h3>Which word doesn't belong with the others?</h3>
      <p class="muted">Hint: the other three are ${escapeHtml(q.category)}.</p>
      <div id="gameArea"></div>
    </div>` + skipButtonHtml(stats.skipsUsed);
    const area = document.getElementById('gameArea');
    q.words.forEach((word, idx) => {
      const b = document.createElement('button');
      b.className = 'mc-option';
      b.textContent = word;
      b.onclick = () => submitGameAnswer(picked, idx === q.oddIndex, dateStr, useHard, isBonus, stats, () => {
        const opts = document.querySelectorAll('.mc-option');
        opts.forEach((el,i)=>{ el.disabled=true; if(i===q.oddIndex) el.classList.add('correct'); else if(i===idx) el.classList.add('wrong'); });
      });
      area.appendChild(b);
    });
    wireSkipButton(dateStr, stats);
    return;
  }

  if(picked.type === 'truefalse'){
    app.innerHTML = header + `
      <span class="eyebrow">True or False</span>
      <h3>${escapeHtml(q.statement)}</h3>
      <div id="gameArea"></div>
    </div>` + skipButtonHtml(stats.skipsUsed);
    const area = document.getElementById('gameArea');
    [['True', true], ['False', false]].forEach(([label, val]) => {
      const b = document.createElement('button');
      b.className = 'mc-option';
      b.textContent = label;
      b.onclick = () => submitGameAnswer(picked, val === q.answer, dateStr, useHard, isBonus, stats, () => {
        const opts = document.querySelectorAll('.mc-option');
        opts.forEach((el,i)=>{
          el.disabled = true;
          const isCorrectBtn = (i===0 && q.answer===true) || (i===1 && q.answer===false);
          if(isCorrectBtn) el.classList.add('correct');
          else if(el.textContent === label) el.classList.add('wrong');
        });
      });
      area.appendChild(b);
    });
    wireSkipButton(dateStr, stats);
    return;
  }
}

function skipButtonHtml(skipsUsed){
  const left = DAILY_SKIP_LIMIT - skipsUsed;
  return `<button class="btn btn-ghost" id="skipBtn" style="margin-top:8px;" ${left<=0?'disabled':''}>⏭ Skip this question (${left} left)</button>`;
}
function wireSkipButton(dateStr, stats){
  const btn = document.getElementById('skipBtn');
  if(btn) btn.onclick = () => useSkip(dateStr, stats);
}

async function useSkip(dateStr, stats){
  if(stats.skipsUsed >= DAILY_SKIP_LIMIT) return;
  const btn = document.getElementById('skipBtn');
  if(btn) btn.disabled = true;
  try{
    await supabaseClient.from('skip_log').insert({
      code: state.studentCode, challenge_date: dateStr, skip_number: stats.skipsUsed + 1
    });
  }catch(e){ console.error('skip failed', e); }
  renderStudentChallenge();
}

function checkFillAnswer(picked, dateStr, useHard, isBonus, stats){
  const q = picked.data;
  const val = document.getElementById('fillInput').value.trim().toLowerCase();
  const correct = q.answers.some(a => a.toLowerCase() === val);
  document.getElementById('fillInput').disabled = true;
  document.getElementById('fillSubmitBtn').disabled = true;
  submitGameAnswer(picked, correct, dateStr, useHard, isBonus, stats, () => {
    document.getElementById('gameArea').innerHTML =
      `<div class="feedback ${correct?'ok':'bad'}">${correct ? '✓ Correct!' : '✗ Not quite. Accepted answer: ' + escapeHtml(q.answers[0])}</div>`;
  });
}

function checkScrambleAnswer(picked, dateStr, useHard, isBonus, stats){
  const q = picked.data;
  const val = document.getElementById('scrambleInput').value.trim().toLowerCase();
  const correct = val === q.word.toLowerCase();
  document.getElementById('scrambleInput').disabled = true;
  document.getElementById('scrambleSubmitBtn').disabled = true;
  submitGameAnswer(picked, correct, dateStr, useHard, isBonus, stats, () => {
    document.getElementById('gameArea').innerHTML =
      `<div class="feedback ${correct?'ok':'bad'}">${correct ? '✓ Correct!' : '✗ Not quite. The word was: ' + escapeHtml(q.word)}</div>`;
  });
}

async function submitGameAnswer(picked, correct, dateStr, useHard, isBonus, stats, uiUpdateFn){
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.disabled = true;
  uiUpdateFn();
  let points = correct ? (useHard ? POINTS_HARD : POINTS_NORMAL) : 0;
  if(isBonus) points *= 2;
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
  fb.textContent = correct
    ? ('✓ +' + points + ' points for ' + state.team.team_name + (isBonus ? ' (Mystery Bonus x2!)' : ''))
    : (isBonus ? '✗ No points, but the Mystery Bonus never counts against your 5 mistakes!' : '✗ No points this round — nice try!');
  document.getElementById('gameArea').appendChild(fb);

  const newAnsweredCount = stats.answeredCount + 1;
  const badgeMsgs = [];

  try{
    // First Blood: is this the very first correct answer of the day, across everyone?
    if(correct){
      const { data: anyCorrectToday } = await supabaseClient.from('team_progress').select('code').eq('challenge_date', dateStr).eq('correct', true).limit(1);
      if(!anyCorrectToday || !anyCorrectToday.length){
        await awardBadge('first_blood', dateStr);
        badgeMsgs.push(BADGE_INFO.first_blood);
      }
    }

    await supabaseClient.from('team_progress').insert({
      code: state.studentCode, challenge_date: dateStr,
      question_number: newAnsweredCount,
      game_type: picked.type, question_key: picked.key,
      correct: correct, points: points, is_bonus: isBonus
    });

    if(correct){
      // Team score + streak
      const { data: teamRow } = await supabaseClient.from('teams').select('*').eq('team_name', state.team.team_name).maybeSingle();
      if(teamRow){
        const newScore = teamRow.total_score + points;
        let newStreak = teamRow.streak_days;
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
        if(teamRow.last_played_date !== dateStr){
          newStreak = (teamRow.last_played_date === yesterday) ? teamRow.streak_days + 1 : 1;
        }
        await supabaseClient.from('teams').update({ total_score: newScore, streak_days: newStreak, last_played_date: dateStr }).eq('team_name', state.team.team_name);
        state.team.total_score = newScore;
        state.team.streak_days = newStreak;
      }
      // XP / level
      const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', state.studentCode).maybeSingle();
      if(codeRow){
        const newXP = (codeRow.xp_points || 0) + points;
        await supabaseClient.from('student_codes').update({
          xp_points: newXP,
          lifetime_correct: (codeRow.lifetime_correct || 0) + 1
        }).eq('code', state.studentCode);
        state.studentXP = newXP;
      }
    }

    // Completion badges + team full-completion bonus, once the 30th question is answered
    if(newAnsweredCount >= DAILY_QUESTION_LIMIT){
      const { data: allRows } = await supabaseClient.from('team_progress').select('*').eq('code', state.studentCode).eq('challenge_date', dateStr);
      const realRows = allRows || [];
      const wrongToday = realRows.filter(r => !r.correct && !r.is_bonus).length;
      if(wrongToday === 0){ await awardBadge('perfect_day', dateStr); badgeMsgs.push(BADGE_INFO.perfect_day); }
      else if(wrongToday >= 4){ await awardBadge('comeback_kid', dateStr); badgeMsgs.push(BADGE_INFO.comeback_kid); }
      await maybeAwardTeamCompletionBonus(dateStr);
    }
  }catch(e){ console.error('submit failed', e); }

  if(badgeMsgs.length){
    const badgeBanner = document.createElement('div');
    badgeBanner.className = 'feedback ok';
    badgeBanner.style.background = '#fef9c3';
    badgeBanner.style.color = '#854d0e';
    badgeBanner.innerHTML = badgeMsgs.map(b => `🏅 New Badge: ${b.icon} ${b.label} — ${b.desc}`).join('<br>');
    document.getElementById('gameArea').appendChild(badgeBanner);
  }

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.style.marginTop = '10px';
  nextBtn.textContent = 'Continue →';
  nextBtn.onclick = () => renderStudentChallenge();
  document.getElementById('gameArea').appendChild(nextBtn);
}

async function awardBadge(badgeKey, dateStr){
  try{ await supabaseClient.from('badges').insert({ code: state.studentCode, badge_key: badgeKey, earned_date: dateStr }); }
  catch(e){ /* likely already awarded today, ignore */ }
}

async function maybeAwardTeamCompletionBonus(dateStr){
  const { data: teamStudents } = await supabaseClient.from('student_codes').select('*').eq('team_name', state.team.team_name);
  if(!teamStudents || !teamStudents.length) return;
  const counts = await Promise.all(teamStudents.map(async s => {
    const { data } = await supabaseClient.from('team_progress').select('question_number').eq('code', s.code).eq('challenge_date', dateStr);
    return (data || []).length;
  }));
  const allFinished = counts.every(c => c >= DAILY_QUESTION_LIMIT);
  if(!allFinished) return;
  const { data: teamRow } = await supabaseClient.from('teams').select('*').eq('team_name', state.team.team_name).maybeSingle();
  if(teamRow && teamRow.completion_bonus_date !== dateStr){
    await supabaseClient.from('teams').update({
      total_score: teamRow.total_score + TEAM_COMPLETION_BONUS,
      completion_bonus_date: dateStr
    }).eq('team_name', state.team.team_name);
  }
}

function miniStandingsRows(teams){
  if(!teams || !teams.length) return '<p class="muted">No teams yet.</p>';
  const medals = ['🥇','🥈','🥉'];
  return teams.map((t,i) => `
    <div class="team-row">
      <div class="team-row-left">

/* ============================================================
/* ============================================================
   DUELS — synchronized head-to-head challenges (team vs team,
   or player vs player). Everyone answers the same question at
   the same time, with a 13s timer, live answer reveal, and
   (team duels only) a leader who can freeze opponents or add
   +10 bonus points instead.
   ============================================================ */
const DUEL_ROUND_SECONDS = 13;

function renderDuelCodeEntry(){
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Challenges</span>
      <h2>Enter your student code</h2>
      <input type="text" id="duelCodeInput" placeholder="e.g. K7P2XQ" maxlength="6" style="text-transform:uppercase; letter-spacing:2px; font-weight:700; text-align:center; font-size:1.2rem;">
      <div id="duelCodeError"></div>
      <button class="btn btn-primary" onclick="submitDuelCode()">Continue</button>
    </div>
  `;
  const input = document.getElementById('duelCodeInput');
  input.focus();
  input.addEventListener('input', () => { input.value = input.value.toUpperCase(); });
  input.addEventListener('keydown', e => { if(e.key==='Enter') submitDuelCode(); });
}
async function submitDuelCode(){
  const code = document.getElementById('duelCodeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('duelCodeError');
  if(!code) return;
  const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', code).maybeSingle();
  if(!codeRow){ errEl.innerHTML = `<div class="feedback bad">That code isn't recognized.</div>`; return; }
  state.studentCode = code;
  state.studentName = codeRow.student_name;
  state.studentXP = codeRow.xp_points || 0;
  navigateTo('duelList');
}

function clearDuelTimer(){
  if(state.duelTimerHandle){ clearInterval(state.duelTimerHandle); state.duelTimerHandle = null; }
  if(state.duelPollHandle){ clearInterval(state.duelPollHandle); state.duelPollHandle = null; }
}

async function renderDuelList(){
  if(!state.studentCode){ navigateTo('duelCodeEntry'); return; }
  clearDuelTimer();
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Loading your challenges…</p></div>`;
  const { data: myEntries } = await supabaseClient.from('duel_participants').select('*').eq('participant_code', state.studentCode);
  const duelIds = (myEntries || []).map(e => e.duel_id);
  let duels = [];
  for(const id of duelIds){

      <div id="duelListArea"></div>
    </div>

  duels.forEach(d => {

    row.innerHTML = `
      <div><div class="team-name">${escapeHtml(d.name)}</div><div class="team-meta">${d.type === 'team' ? 'Team vs Team' : 'Player vs Player'} · ${d.status==='waiting'?'Waiting to start':'In progress'}</div></div>
      <span style="color:var(--muted);">›</span>
    `;
    row.onclick = () => { state.currentDuelId = d.id; navigateTo('duelPlay'); };
    area.appendChild(row);

}

/* ---- Waiting room: wait until everyone required has joined ---- */
async function renderDuelPlay(){
  const duelId = state.currentDuelId;
  if(!duelId || !state.studentCode){ navigateTo('duelList'); return; }
  clearDuelTimer();
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Loading challenge…</p></div>`;

  const { data: duel } = await supabaseClient.from('duels').select('*').eq('id', duelId).maybeSingle();
  if(!duel){ navigateTo('duelList'); return; }
  const { data: participants } = await supabaseClient.from('duel_participants').select('*').eq('duel_id', duelId);
  const me = (participants||[]).find(p => p.participant_code === state.studentCode);
  if(!me){ navigateTo('duelList'); return; }

  if(duel.status === 'ended'){
    await showDuelResult(duel, participants);
    return;
  }

  if(duel.status === 'waiting'){
    if(!me.joined){
      await supabaseClient.from('duel_participants').update({ joined: true }).eq('duel_id', duelId).eq('participant_code', state.studentCode);
      me.joined = true;
    }
    const allJoined = (participants||[]).every(p => p.joined || p.participant_code === state.studentCode);
    if(allJoined){
      // Try to start the duel (harmless if another client also does this).
      await supabaseClient.from('duels').update({ status:'active', current_round:0, round_started_at: new Date().toISOString() }).eq('id', duelId);
      renderDuelPlay();
      return;
    }
    const joinedCount = (participants||[]).filter(p=>p.joined).length + (me.joined?0:1);
    app.innerHTML = `
      ${topbar()}
      <div class="card">
        <span class="eyebrow">⚔️ ${escapeHtml(duel.name)}</span>
        <h2>Waiting for opponents…</h2>
        <p class="muted">${joinedCount}/${(participants||[]).length} players have joined. Everyone must be here before the challenge starts.</p>
        <div id="waitList"></div>
      </div>
    `;
    const listDiv = document.getElementById('waitList');
    (participants||[]).forEach(p => {
      const joined = p.joined || p.participant_code === state.studentCode;
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = `<span>${escapeHtml(p.participant_code)} (Side ${p.side.toUpperCase()})</span><span class="${joined?'':'muted'}">${joined?'✓ Joined':'Waiting…'}</span>`;
      listDiv.appendChild(row);
    });
    state.duelPollHandle = setInterval(() => renderDuelPlay(), 2000);
    return;
  }

  // duel.status === 'active'
  await renderDuelRound(duel, participants, me);
}

async function showDuelResult(duel, participants){
  const { sideA, sideB, scoreByCode } = await duelScores(duel.id);
  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">⚔️ ${escapeHtml(duel.name)}</span>
      <h2>Challenge Complete</h2>
      <div class="feedback ${duel.winner_side==='draw'?'bad':'ok'}">
        ${duel.winner_side === 'draw' ? "🤝 It's a draw!" : `🏆 Side ${(duel.winner_side||'').toUpperCase()} won!`}
      </div>
      ${duelScoreboardHtml(participants, {sideA, sideB, scoreByCode})}
    </div>
  `;
}

async function renderDuelRound(duel, participants, me){
  const keys = duel.question_keys.split(',');
  const roundIndex = duel.current_round;

  if(roundIndex >= keys.length){
    await autoEndDuelIfNeeded(duel);
    await renderDuelPlay();
    return;
  }

  const [{ data: roundProgress }, { data: myDisables }] = await Promise.all([
    supabaseClient.from('duel_progress').select('*').eq('duel_id', duel.id).eq('question_index', roundIndex),
    supabaseClient.from('duel_disables').select('*').eq('duel_id', duel.id).eq('target_code', state.studentCode)
  ]);
  const activeDisable = (myDisables||[]).find(d => d.disabled_until_index > roundIndex);
  const myAnswer = (roundProgress||[]).find(r => r.participant_code === state.studentCode);
  const activeCount = participants.filter(p => {
    const dis = (myDisables && p.participant_code===state.studentCode) ? activeDisable : null;
    return true; // recomputed properly below per-participant
  }).length;

  // Determine who's required to answer this round (non-disabled at this index)
  const disabledCodesThisRound = new Set();
  for(const p of participants){
    const { data: pd } = await supabaseClient.from('duel_disables').select('*').eq('duel_id', duel.id).eq('target_code', p.participant_code);
    if((pd||[]).some(d => d.disabled_until_index > roundIndex)) disabledCodesThisRound.add(p.participant_code);
  }
  const requiredCodes = participants.filter(p => !disabledCodesThisRound.has(p.participant_code)).map(p=>p.participant_code);
  const answeredCodes = new Set((roundProgress||[]).map(r=>r.participant_code));
  const allAnswered = requiredCodes.every(c => answeredCodes.has(c));

  const elapsedMs = Date.now() - new Date(duel.round_started_at).getTime();
  const remainingSec = Math.max(0, DUEL_ROUND_SECONDS - Math.floor(elapsedMs/1000));

  const picked = questionByKey(keys[roundIndex]);
  const q = picked.data;

  const header = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">⚔️ ${escapeHtml(duel.name)} — Q${roundIndex+1}/${keys.length}</span>
      <h2>${escapeHtml(state.studentName)} — Side ${me.side.toUpperCase()}</h2>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span class="muted" style="font-size:0.8rem;">${answeredCodes.size}/${requiredCodes.length} answered</span>
        <span id="duelTimerDisplay" style="font-family:var(--font-head); font-weight:800; color:${remainingSec<=4?'var(--bad)':'var(--ink)'};">⏱ ${remainingSec}s</span>
      </div>
  `;

  if(activeDisable){
    const remaining = activeDisable.disabled_until_index - roundIndex;
    app.innerHTML = header + `
      <div class="feedback bad">🚫 You're frozen! ${remaining} more question${remaining!==1?'s':''} to go. You can still watch.</div>
      <h3>${questionPromptText(picked)}</h3>
      <div id="liveAnswers"></div>
    </div>`;
    renderLiveAnswers(participants, roundProgress);
    scheduleDuelPoll(duel, participants, me, roundIndex);
    return;
  }

  if(myAnswer){
    app.innerHTML = header + `
      <div class="feedback ${myAnswer.correct?'ok':'bad'}">${myAnswer.correct?'✓ You got it!':'✗ Not this time.'} Waiting for everyone else…</div>
      <h3>${questionPromptText(picked)}</h3>
      <div id="liveAnswers"></div>
    </div>`;
    renderLiveAnswers(participants, roundProgress);
    scheduleDuelPoll(duel, participants, me, roundIndex);
    return;
  }

  if(remainingSec <= 0){
    // Time's up and I never answered — auto-submit as wrong, then poll.
    await supabaseClient.from('duel_progress').insert({ duel_id: duel.id, participant_code: state.studentCode, question_index: roundIndex, correct: false, chosen_answer: null });
    await renderDuelPlay();
    return;
  }

  renderDuelQuestionInteractive(duel, participants, me, roundIndex, picked, header, remainingSec);
}

function questionPromptText(picked){
  const q = picked.data;
  if(picked.type === 'mcq') return q.q;
  if(picked.type === 'fill') return q.prompt;
  if(picked.type === 'scramble') return 'Unscramble: ' + shuffleLetters(q.word) + ' (Hint: ' + q.hint + ')';
  if(picked.type === 'oddOneOut') return 'Odd one out: ' + q.words.join(', ');
  if(picked.type === 'truefalse') return q.statement;
  return '';
}

function renderLiveAnswers(participants, roundProgress){
  const div = document.getElementById('liveAnswers');
  if(!div) return;
  div.innerHTML = `<p class="muted" style="font-size:0.8rem; margin-top:10px;">What everyone picked:</p>`;
  participants.forEach(p => {
    const row = (roundProgress||[]).find(r => r.participant_code === p.participant_code);
    const line = document.createElement('div');
    line.className = 'student-row';
    line.innerHTML = `<span>${escapeHtml(p.participant_code)} (${p.side.toUpperCase()})</span><span class="${row ? (row.correct?'':'weak-tag') : 'muted'}">${row ? (row.chosen_answer ?? (row.correct?'✓':'✗')) : '…'}</span>`;
    div.appendChild(line);
  });
}

function scheduleDuelPoll(duel, participants, me, roundIndex){
  clearDuelTimer();
  state.duelPollHandle = setInterval(async () => {
    const { data: freshDuel } = await supabaseClient.from('duels').select('*').eq('id', duel.id).maybeSingle();
    if(!freshDuel) return;
    if(freshDuel.status === 'ended' || freshDuel.current_round !== roundIndex){
      clearDuelTimer();
      renderDuelPlay();
      return;
    }
    // Check if round should advance (everyone answered or time up)
    const { data: roundProgress } = await supabaseClient.from('duel_progress').select('*').eq('duel_id', duel.id).eq('question_index', roundIndex);
    const disabledCodes = new Set();
    for(const p of participants){
      const { data: pd } = await supabaseClient.from('duel_disables').select('*').eq('duel_id', duel.id).eq('target_code', p.participant_code);
      if((pd||[]).some(d => d.disabled_until_index > roundIndex)) disabledCodes.add(p.participant_code);
    }
    const requiredCodes = participants.filter(p => !disabledCodes.has(p.participant_code)).map(p=>p.participant_code);
    const answeredCodes = new Set((roundProgress||[]).map(r=>r.participant_code));
    const allAnswered = requiredCodes.every(c => answeredCodes.has(c));
    const elapsedMs = Date.now() - new Date(freshDuel.round_started_at).getTime();
    const timeUp = elapsedMs >= DUEL_ROUND_SECONDS*1000;

    if(allAnswered || timeUp){
      if(freshDuel.current_round === roundIndex){
        await supabaseClient.from('duels').update({ current_round: roundIndex+1, round_started_at: new Date().toISOString() }).eq('id', duel.id);
      }
      clearDuelTimer();
      renderDuelPlay();
    } else {
      const el = document.getElementById('duelTimerDisplay');
      if(el){
        const rem = Math.max(0, DUEL_ROUND_SECONDS - Math.floor(elapsedMs/1000));
        el.textContent = '⏱ ' + rem + 's';
      }
      renderLiveAnswers(participants, roundProgress);
    }
  }, 1500);
}

function renderDuelQuestionInteractive(duel, participants, me, roundIndex, picked, header, remainingSec){
  const q = picked.data;
  const canAct = duel.type === 'team' && me.is_leader;
  const streak = state.duelMyStreak || 0; // best-effort local hint only
  const actionsHtml = canAct ? `
    <div class="divider"></div>
    <p class="muted" style="font-size:0.8rem;">Leader tools:</p>
    <button class="btn btn-ghost" id="duelActionBtn" style="margin-bottom:8px;">🎯 Freeze / Bonus</button>
  ` : '';

  const bodyEnd = `
      <div id="gameArea"></div>
      ${actionsHtml}
    </div>
  `;

  function afterAnswer(){
    if(canAct){
      const btn = document.getElementById('duelActionBtn');
      if(btn) btn.onclick = () => showDuelActionPicker(duel, participants, me, roundIndex);
    }
    scheduleDuelPoll(duel, participants, me, roundIndex);
  }

  if(picked.type === 'mcq'){
    app.innerHTML = header + `<span class="eyebrow">Multiple Choice</span><h3>${q.q}</h3>` + bodyEnd;
    const area = document.getElementById('gameArea');
    q.opts.forEach((opt, idx) => {
      const b = document.createElement('button'); b.className='mc-option'; b.textContent=opt;
      b.onclick = () => submitDuelAnswer(duel, roundIndex, picked, idx===q.correct, opt, () => {
        document.querySelectorAll('.mc-option').forEach((el,i)=>{el.disabled=true; if(i===q.correct) el.classList.add('correct'); else if(i===idx) el.classList.add('wrong');});
      }, afterAnswer);
      area.appendChild(b);
    });
  } else if(picked.type === 'fill'){
    app.innerHTML = header + `<span class="eyebrow">Fill in the Blank</span><h3>${q.prompt}</h3><input type="text" id="duelFillInput" placeholder="Type your answer">` + bodyEnd + `<button class="btn btn-primary" id="duelSubmitBtn" style="margin-top:8px;">Submit</button>`;
    document.getElementById('duelFillInput').focus();
    document.getElementById('duelSubmitBtn').onclick = () => {
      const val = document.getElementById('duelFillInput').value.trim().toLowerCase();
      const correct = q.answers.some(a=>a.toLowerCase()===val);
      document.getElementById('duelFillInput').disabled = true; document.getElementById('duelSubmitBtn').disabled = true;
      submitDuelAnswer(duel, roundIndex, picked, correct, val, () => {
        document.getElementById('gameArea').innerHTML = `<div class="feedback ${correct?'ok':'bad'}">${correct?'✓ Correct!':'✗ Answer: '+escapeHtml(q.answers[0])}</div>`;
      }, afterAnswer);
    };
  } else if(picked.type === 'scramble'){
    const scrambled = shuffleLetters(q.word);
    app.innerHTML = header + `<span class="eyebrow">Word Scramble</span><p class="muted">Hint: ${escapeHtml(q.hint)}</p><div class="scramble-word">${scrambled}</div><input type="text" id="duelScrambleInput" placeholder="Unscramble">` + bodyEnd + `<button class="btn btn-primary" id="duelSubmitBtn" style="margin-top:8px;">Submit</button>`;
    document.getElementById('duelScrambleInput').focus();
    document.getElementById('duelSubmitBtn').onclick = () => {
      const val = document.getElementById('duelScrambleInput').value.trim().toLowerCase();
      const correct = val === q.word.toLowerCase();
      document.getElementById('duelScrambleInput').disabled = true; document.getElementById('duelSubmitBtn').disabled = true;
      submitDuelAnswer(duel, roundIndex, picked, correct, val, () => {
        document.getElementById('gameArea').innerHTML = `<div class="feedback ${correct?'ok':'bad'}">${correct?'✓ Correct!':'✗ Word was: '+escapeHtml(q.word)}</div>`;
      }, afterAnswer);
    };
  } else if(picked.type === 'oddOneOut'){
    app.innerHTML = header + `<span class="eyebrow">Odd One Out</span><h3>Which word doesn't belong?</h3><p class="muted">${escapeHtml(q.category)}</p>` + bodyEnd;
    const area = document.getElementById('gameArea');
    q.words.forEach((word, idx) => {
      const b = document.createElement('button'); b.className='mc-option'; b.textContent=word;
      b.onclick = () => submitDuelAnswer(duel, roundIndex, picked, idx===q.oddIndex, word, () => {
        document.querySelectorAll('.mc-option').forEach((el,i)=>{el.disabled=true; if(i===q.oddIndex) el.classList.add('correct'); else if(i===idx) el.classList.add('wrong');});
      }, afterAnswer);
      area.appendChild(b);
    });
  } else if(picked.type === 'truefalse'){
    app.innerHTML = header + `<span class="eyebrow">True or False</span><h3>${escapeHtml(q.statement)}</h3>` + bodyEnd;
    const area = document.getElementById('gameArea');
    [['True',true],['False',false]].forEach(([label,val]) => {
      const b = document.createElement('button'); b.className='mc-option'; b.textContent=label;
      b.onclick = () => submitDuelAnswer(duel, roundIndex, picked, val===q.answer, label, () => {
        document.querySelectorAll('.mc-option').forEach((el,i)=>{ el.disabled=true; const isC=(i===0&&q.answer===true)||(i===1&&q.answer===false); if(isC) el.classList.add('correct'); else if(el.textContent===label) el.classList.add('wrong'); });
      }, afterAnswer);
      area.appendChild(b);
    });
  }

  // live-updating countdown for the person still answering
  state.duelTimerHandle = setInterval(() => {
    const el = document.getElementById('duelTimerDisplay');
    if(!el){ clearInterval(state.duelTimerHandle); return; }
    const elapsedMs = Date.now() - new Date(duel.round_started_at).getTime();
    const rem = Math.max(0, DUEL_ROUND_SECONDS - Math.floor(elapsedMs/1000));
    el.textContent = '⏱ ' + rem + 's';
    el.style.color = rem<=4 ? 'var(--bad)' : 'var(--ink)';
    if(rem <= 0){ clearInterval(state.duelTimerHandle); renderDuelPlay(); }
  }, 500);
}

async function submitDuelAnswer(duel, roundIndex, picked, correct, chosenAnswer, uiFn, afterFn){
  clearDuelTimer();
  uiFn();
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (correct?'ok':'bad');
  fb.textContent = correct ? '✓ Point scored!' : '✗ No point this round.';
  document.getElementById('gameArea').appendChild(fb);
  try{
    await supabaseClient.from('duel_progress').insert({ duel_id: duel.id, participant_code: state.studentCode, question_index: roundIndex, correct, chosen_answer: String(chosenAnswer).slice(0,60) });
  }catch(e){ console.error(e); }
  afterFn();
}

async function duelScores(duelId){
  const { data: progress } = await supabaseClient.from('duel_progress').select('*').eq('duel_id', duelId);
  const { data: participants } = await supabaseClient.from('duel_participants').select('*').eq('duel_id', duelId);
  const scoreByCode = {};
  (progress||[]).forEach(p => { if(p.correct) scoreByCode[p.participant_code] = (scoreByCode[p.participant_code]||0) + 1; });
  let sideA = 0, sideB = 0;
  (participants||[]).forEach(p => {
    const s = scoreByCode[p.participant_code] || 0;
    if(p.side === 'a') sideA += s; else sideB += s;
  });
  return { sideA, sideB, scoreByCode };
}

function duelScoreboardHtml(participants, scores){
  const sideAList = participants.filter(p=>p.side==='a');
  const sideBList = participants.filter(p=>p.side==='b');
  return `
    <div class="divider"></div>
    <div style="display:flex; justify-content:space-between; font-family:var(--font-head); font-weight:800; font-size:1.3rem; margin-bottom:10px;">
      <span>${scores.sideA}</span><span class="muted" style="font-size:0.9rem;">VS</span><span>${scores.sideB}</span>
    </div>
    <div style="display:flex; justify-content:space-between; gap:10px;">
      <div style="flex:1;">${sideAList.map(p=>`<div class="muted" style="font-size:0.8rem;">${escapeHtml(p.participant_code)}${p.is_leader?' 👑':''}: ${scores.scoreByCode[p.participant_code]||0}</div>`).join('')}</div>
      <div style="flex:1; text-align:right;">${sideBList.map(p=>`<div class="muted" style="font-size:0.8rem;">${escapeHtml(p.participant_code)}${p.is_leader?' 👑':''}: ${scores.scoreByCode[p.participant_code]||0}</div>`).join('')}</div>
    </div>
  `;
}

async function autoEndDuelIfNeeded(duel){
  if(duel.status === 'ended') return;
  const { sideA, sideB } = await duelScores(duel.id);
  let winnerSide = 'draw';
  if(sideA > sideB) winnerSide = 'a'; else if(sideB > sideA) winnerSide = 'b';
  await supabaseClient.from('duels').update({ status:'ended', winner_side: winnerSide }).eq('id', duel.id);
  await applyDuelWins(duel.id, winnerSide);
}

async function applyDuelWins(duelId, winnerSide){
  if(winnerSide === 'draw') return;
  const { data: participants } = await supabaseClient.from('duel_participants').select('*').eq('duel_id', duelId);
  const winners = (participants||[]).filter(p => p.side === winnerSide);
  const wonTeams = new Set();
  for(const w of winners){
    if(w.team_name) wonTeams.add(w.team_name);
  }
  for(const tn of wonTeams){
    const { data: teamRow } = await supabaseClient.from('teams').select('*').eq('team_name', tn).maybeSingle();
    if(teamRow){
      await supabaseClient.from('teams').update({ duel_wins: (teamRow.duel_wins||0) + 1 }).eq('team_name', tn);
    }
  }
  // Player-vs-player duels: individual winner also gets a personal duel win.
  if(!wonTeams.size){
    for(const w of winners){
      const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', w.participant_code).maybeSingle();
      if(codeRow){
        await supabaseClient.from('student_codes').update({ duel_wins: (codeRow.duel_wins||0) + 1 }).eq('code', w.participant_code);
      }
    }
  }
}

/* ---- Leader action: freeze one/two opponents, or +10 team bonus ---- */
async function showDuelActionPicker(duel, participants, me, roundIndex){
  const opponents = participants.filter(p => p.side !== me.side);
  let overlay = document.getElementById('freezeOverlay');
  if(!overlay){ overlay = document.createElement('div'); overlay.id='freezeOverlay'; document.body.appendChild(overlay); }
  overlay.innerHTML = `
    <div class="freeze-modal">
      <p class="muted">🎯 Choose an action:</p>
      <button class="btn btn-ghost" id="pickFreezeBtn" style="margin-bottom:8px;">❄️ Freeze opponent(s)</button>
      <button class="btn btn-ghost" id="pickBonusBtn" style="margin-bottom:8px;">➕ +10 points to my team instead</button>
      <button class="btn btn-ghost" onclick="document.getElementById('freezeOverlay').innerHTML=''">Cancel</button>
      <div id="freezeSubArea"></div>
    </div>
  `;
  document.getElementById('pickBonusBtn').onclick = async () => {
    if(!me.team_name) return;
    const { data: teamRow } = await supabaseClient.from('teams').select('*').eq('team_name', me.team_name).maybeSingle();
    if(teamRow){
      await supabaseClient.from('teams').update({ total_score: teamRow.total_score + 10 }).eq('team_name', me.team_name);
    }
    await supabaseClient.from('duel_actions').insert({ duel_id: duel.id, question_index: roundIndex, actor_code: state.studentCode, action_type: 'bonus_points', target_codes: null });
    overlay.innerHTML = `<div class="freeze-modal"><div class="feedback ok">➕ +10 points added to ${escapeHtml(me.team_name)}!</div></div>`;
    setTimeout(() => { overlay.innerHTML = ''; }, 1500);
  };
  document.getElementById('pickFreezeBtn').onclick = () => {
    const sub = document.getElementById('freezeSubArea');
    sub.innerHTML = `<p class="muted" style="margin-top:10px;">Pick 1 opponent (frozen 5 questions) or 2 opponents (frozen 2 questions each):</p><div id="kickChoices"></div><button class="btn btn-primary" id="confirmKickBtn" disabled>Confirm</button>`;
    const choicesDiv = document.getElementById('kickChoices');
    const selected = new Set();
    opponents.forEach(o => {
      const b = document.createElement('button');
      b.className = 'mc-option';
      b.textContent = o.participant_code + (o.team_name ? ' ('+o.team_name+')' : '');
      b.onclick = () => {
        if(selected.has(o.participant_code)){ selected.delete(o.participant_code); b.classList.remove('correct'); }
        else if(selected.size < 2){ selected.add(o.participant_code); b.classList.add('correct'); }
        document.getElementById('confirmKickBtn').disabled = selected.size === 0;
      };
      choicesDiv.appendChild(b);
    });
    document.getElementById('confirmKickBtn').onclick = async () => {
      const targets = [...selected];
      const questionsEach = targets.length === 1 ? 5 : 2;
      for(const targetCode of targets){
        await supabaseClient.from('duel_disables').insert({ duel_id: duel.id, target_code: targetCode, disabled_until_index: roundIndex + questionsEach });
      }
      await supabaseClient.from('duel_actions').insert({
        duel_id: duel.id, question_index: roundIndex, actor_code: state.studentCode,
        action_type: targets.length===1 ? 'freeze_one' : 'freeze_two', target_codes: targets.join(',')
      });
      overlay.innerHTML = `<div class="freeze-modal"><div class="feedback ok">❄️ Froze ${targets.length} player(s)!</div></div>`;
      setTimeout(() => { overlay.innerHTML = ''; }, 1500);
    };
  };
}

/* ---------------- Teacher: create & manage duels ---------------- */
async function renderTeacherDuels(){
  if(!state.teacherAuthed){ navigateTo('teacherLogin'); return; }
  app.innerHTML = `${topbar()}<div class="card"><p class="muted center-note">Loading challenges…</p></div>`;
  const [{ data: teams }, { data: students }, { data: duels }] = await Promise.all([
    supabaseClient.from('teams').select('*').order('team_name', { ascending:true }),
    supabaseClient.from('student_codes').select('*').order('student_name', { ascending:true }),
    supabaseClient.from('duels').select('*').order('created_at', { ascending:false })
  ]);
  const teamList = teams || [];
  const studentList = (students || []).filter(s => s.team_name);
  const duelList = duels || [];

  app.innerHTML = `
    ${topbar()}
    <div class="card">
      <span class="eyebrow">Challenges</span>
      <h2>Create a Head-to-Head Duel</h2>
      <input type="text" id="duelName" placeholder="Challenge name (e.g. Falcons vs Tigers)" maxlength="40">
      <p class="muted" style="margin-bottom:8px;">Type</p>
      <select id="duelType" onchange="renderDuelSidePickers()">
        <option value="team">Team(s) vs Team(s)</option>
        <option value="player">Player(s) vs Player(s)</option>
      </select>
      <div id="duelSidePickers"></div>
      <div id="duelLeaderPickers"></div>
      <button class="btn btn-primary" onclick="createDuel()">⚔️ Create Challenge</button>
      <div id="duelCreateResult"></div>
    </div>

    <div class="card">
      <span class="eyebrow">Active &amp; Past Challenges (${duelList.length})</span>
      <h2>Challenges</h2>
      <div id="duelsManageList">
        ${duelList.length ? '' : '<p class="muted">No challenges yet.</p>'}
      </div>
    </div>
  `;
  window.__teamListForDuels = teamList;
  window.__studentListForDuels = studentList;
  renderDuelSidePickers();

  const listEl = document.getElementById('duelsManageList');
  for(const d of duelList){
    const scores = await duelScores(d.id);
    const { data: participants } = await supabaseClient.from('duel_participants').select('*').eq('duel_id', d.id);
    const { data: actions } = await supabaseClient.from('duel_actions').select('*').eq('duel_id', d.id);
    const row = document.createElement('div');
    row.className = 'team-row';
    row.style.cssText = 'flex-direction:column; align-items:stretch;';
    const statusLabel = d.status==='waiting' ? 'waiting' : (d.status==='active' ? 'in progress' : 'ended');
    row.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="team-name">${escapeHtml(d.name)}</div>
          <div class="team-meta">${d.type==='team'?'Team vs Team':'Player vs Player'} · <span class="status-pill ${d.status==='ended'?'status-closed':'status-open'}">${statusLabel}</span></div>
        </div>
        <div style="font-family:var(--font-head); font-weight:800;">${scores.sideA} : ${scores.sideB}</div>
      </div>
      <div id="duelDetail-${d.id}" style="display:none; margin-top:10px;"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-ghost" data-detail-id="${d.id}">Details</button>
        ${d.status!=='ended' ? `<button class="btn btn-danger" data-end-id="${d.id}">End Now</button>` : ''}
      </div>
    `;
    row.querySelector('[data-detail-id]').onclick = () => toggleDuelDetail(d, participants||[], scores, actions||[]);
    const endBtn = row.querySelector('[data-end-id]');
    if(endBtn) endBtn.onclick = () => endDuelManually(d.id, scores);
    listEl.appendChild(row);
  }
}

function toggleDuelDetail(duel, participants, scores, actions){
  const div = document.getElementById('duelDetail-'+duel.id);
  if(div.style.display === 'block'){ div.style.display = 'none'; return; }
  div.style.display = 'block';
  const sideA = participants.filter(p=>p.side==='a');
  const sideB = participants.filter(p=>p.side==='b');
  const actionLabels = { freeze_one:'❄️ Froze 1 opponent (5 Qs)', freeze_two:'❄️ Froze 2 opponents (2 Qs each)', bonus_points:'➕ Took +10 team points' };
  div.innerHTML = `
    <div class="divider"></div>
    <p class="muted" style="font-size:0.78rem;">Side A</p>
    ${sideA.map(p=>`<div class="student-row"><span>${escapeHtml(p.participant_code)}${p.is_leader?' 👑':''}${p.team_name?' — '+escapeHtml(p.team_name):''}</span><span>${scores.scoreByCode[p.participant_code]||0} correct</span></div>`).join('')}
    <p class="muted" style="font-size:0.78rem; margin-top:8px;">Side B</p>
    ${sideB.map(p=>`<div class="student-row"><span>${escapeHtml(p.participant_code)}${p.is_leader?' 👑':''}${p.team_name?' — '+escapeHtml(p.team_name):''}</span><span>${scores.scoreByCode[p.participant_code]||0} correct</span></div>`).join('')}
    ${duel.winner_side ? `<p style="margin-top:8px; font-weight:700;">${duel.winner_side==='draw'?'Result: Draw':'Winner: Side '+duel.winner_side.toUpperCase()}</p>` : ''}
    ${actions.length ? `<p class="muted" style="font-size:0.78rem; margin-top:8px;">Leader actions:</p>${actions.map(a=>`<div class="student-row"><span>${escapeHtml(a.actor_code)} (Q${a.question_index+1})</span><span>${actionLabels[a.action_type]||a.action_type}${a.target_codes?': '+escapeHtml(a.target_codes):''}</span></div>`).join('')}` : ''}
  `;
}

function renderDuelSidePickers(){
  const type = document.getElementById('duelType').value;
  const source = type === 'team' ? window.__teamListForDuels : window.__studentListForDuels;
  const getLabel = type === 'team' ? (x => x.team_name) : (x => x.student_name + ' ('+x.team_name+')');
  const getId = type === 'team' ? (x => x.team_name) : (x => x.code);
  const pickerHtml = (side) => `
    <p class="muted" style="margin-bottom:6px;">Side ${side.toUpperCase()}</p>
    <div style="max-height:160px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:12px;">
      ${(source||[]).map(x => `
        <label style="display:block; padding:4px 0; font-size:0.9rem;">
          <input type="checkbox" class="duel-side-${side}" value="${escapeHtml(getId(x))}" onchange="renderDuelLeaderPickers()"> ${escapeHtml(getLabel(x))}
        </label>
      `).join('') || '<span class="muted">Nothing available yet.</span>'}
    </div>
  `;
  document.getElementById('duelSidePickers').innerHTML = pickerHtml('a') + pickerHtml('b');
  renderDuelLeaderPickers();
}

function renderDuelLeaderPickers(){
  const type = document.getElementById('duelType').value;
  const el = document.getElementById('duelLeaderPickers');
  if(type !== 'team'){ el.innerHTML = ''; return; }
  const sideATeams = [...document.querySelectorAll('.duel-side-a:checked')].map(el=>el.value);
  const sideBTeams = [...document.querySelectorAll('.duel-side-b:checked')].map(el=>el.value);
  function leaderSelect(side, teamNames){
    if(!teamNames.length) return '';
    return teamNames.map(tn => {
      const members = window.__studentListForDuels.filter(s => s.team_name === tn);
      return `
        <p class="muted" style="margin-bottom:4px; font-size:0.8rem;">Leader for ${escapeHtml(tn)} (Side ${side.toUpperCase()})</p>
        <select class="duel-leader-${side}" data-team="${escapeHtml(tn)}">
          ${members.map(m=>`<option value="${escapeHtml(m.code)}">${escapeHtml(m.student_name)}</option>`).join('')}
        </select>
      `;
    }).join('');
  }
  el.innerHTML = leaderSelect('a', sideATeams) + leaderSelect('b', sideBTeams);
}

async function createDuel(){
  const name = document.getElementById('duelName').value.trim();
  const type = document.getElementById('duelType').value;
  const resultEl = document.getElementById('duelCreateResult');
  const sideAIds = [...document.querySelectorAll('.duel-side-a:checked')].map(el => el.value);
  const sideBIds = [...document.querySelectorAll('.duel-side-b:checked')].map(el => el.value);
  if(!name || !sideAIds.length || !sideBIds.length){
    resultEl.innerHTML = `<div class="feedback bad">Enter a name and pick at least one participant on each side.</div>`;
    return;
  }
  resultEl.innerHTML = `<p class="muted">Creating…</p>`;
  const questionKeys = pickDuelQuestions(DUEL_QUESTION_COUNT).join(',');
  const { data: created, error } = await supabaseClient.from('duels').insert({ name, type, question_keys: questionKeys, status:'waiting' });
  if(error || !created || !created[0]){
    resultEl.innerHTML = `<div class="feedback bad">Could not create challenge: ${escapeHtml(error ? (error.message||String(error)) : 'unknown error')}</div>`;
    return;
  }
  const duelId = created[0].id;

  const leaderByTeamSide = {};
  if(type === 'team'){
    document.querySelectorAll('[class^="duel-leader-"]').forEach(sel => {
      const side = sel.className.includes('duel-leader-a') ? 'a' : 'b';
      leaderByTeamSide[side + ':' + sel.dataset.team] = sel.value;
    });
  }

  async function expandSide(ids, side){
    if(type === 'team'){
      for(const teamName of ids){
        const members = window.__studentListForDuels.filter(s => s.team_name === teamName);
        const leaderCode = leaderByTeamSide[side + ':' + teamName];
        for(const m of members){
          await supabaseClient.from('duel_participants').insert({ duel_id: duelId, participant_code: m.code, side, team_name: teamName, is_leader: m.code === leaderCode });
        }
      }
    } else {
      for(const code of ids){
        const student = window.__studentListForDuels.find(s => s.code === code);
        await supabaseClient.from('duel_participants').insert({ duel_id: duelId, participant_code: code, side, team_name: student ? student.team_name : null });
      }
    }
  }
  await expandSide(sideAIds, 'a');
  await expandSide(sideBIds, 'b');

  resultEl.innerHTML = `<div class="feedback ok">✓ Challenge "${escapeHtml(name)}" created! Students will see it once they open Challenges.</div>`;
  renderTeacherDuels();
}

async function endDuelManually(duelId, scores){
  if(!confirm('End this challenge now? The side with more correct answers wins.')) return;
  let winnerSide = 'draw';
  if(scores.sideA > scores.sideB) winnerSide = 'a';
  else if(scores.sideB > scores.sideA) winnerSide = 'b';
  await supabaseClient.from('duels').update({ status:'ended', winner_side: winnerSide }).eq('id', duelId);
  await applyDuelWins(duelId, winnerSide);
  renderTeacherDuels();
}


/* ============================================================
   BOOT — restore where the user left off on refresh
   ============================================================ */
async function boot(){
  const saved = loadPersistedState();
  if(saved){
    state.history = saved.history || [];
    state.teacherAuthed = !!saved.teacherAuthed;
    state.studentCode = saved.studentCode || null;

    if(saved.screen === 'teacherDashboard' && !state.teacherAuthed){
      state.screen = 'roleSelect'; state.history = [];
    } else if((saved.screen === 'studentChallenge' || saved.screen === 'studentHub') && state.studentCode){
      try{
        const { data: codeRow } = await supabaseClient.from('student_codes').select('*').eq('code', state.studentCode).maybeSingle();
        if(codeRow){
          const { data: team } = await supabaseClient.from('teams').select('*').eq('team_name', codeRow.team_name).maybeSingle();
          if(team){ state.team = team; state.studentName = codeRow.student_name; state.studentXP = codeRow.xp_points || 0; state.screen = saved.screen; }
          else { state.screen = 'roleSelect'; state.history = []; }
        } else { state.screen = 'roleSelect'; state.history = []; }
      }catch(e){ state.screen = 'roleSelect'; state.history = []; }
    } else if(['studentCodeEntry','standings','teacherLogin','teacherDashboard','duelList','teacherDuels'].includes(saved.screen)){
      state.screen = saved.screen;
    } else {
      state.screen = 'roleSelect'; state.history = [];
    }
  }
  render();
}
boot();
